<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生化完整題庫 — Chapter 6 & 7</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #d8e4ec;
  --surface: #e8f0f5;
  --card: #f2f7fa;
  --accent: #7a9db5;
  --accent-dk: #4e7a96;
  --accent-dkr: #2f5870;
  --muted: #a8bfcc;
  --text: #2c3e49;
  --text-soft: #5a7180;
  --correct: #7aab8a;
  --correct-bg: #eaf4ee;
  --wrong: #b87a7a;
  --wrong-bg: #f4eaea;
  --border: #c0d4de;
  --highlight: #b8d0de;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;}
.header{background:var(--accent-dkr);padding:2rem 1.5rem 1.5rem;text-align:center;}
.header h1{font-family:'Noto Serif TC',serif;font-size:1.7rem;color:#deeaf2;font-weight:400;margin-bottom:.3rem;}
.header p{color:var(--muted);font-size:.85rem;}
.prog-wrap{background:rgba(255,255,255,.15);height:4px;margin-top:1.2rem;border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--muted);transition:width .4s;border-radius:2px;}
.container{max-width:820px;margin:0 auto;padding:1.5rem 1.2rem 4rem;}

/* filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem;align-items:center;}
.filter-bar label{font-size:.8rem;color:var(--text-soft);margin-right:.3rem;}
.ch-btn{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:.3rem .9rem;font-size:.8rem;color:var(--text-soft);cursor:pointer;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
.ch-btn.active{background:var(--accent-dkr);border-color:var(--accent-dkr);color:#deeaf2;}
.stats-row{display:flex;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.stat-pill{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.4rem .9rem;font-size:.8rem;color:var(--text-soft);}
.stat-pill strong{color:var(--accent-dkr);}

/* question card */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.2rem;transition:box-shadow .2s;}
.ch-badge{display:inline-block;background:var(--accent);color:#f0f6fa;font-size:.7rem;font-weight:500;letter-spacing:.06em;padding:2px 9px;border-radius:20px;margin-bottom:.6rem;}
.img-note{display:inline-block;background:#fff3e0;color:#8a6020;border:1px solid #e8c87a;font-size:.72rem;padding:2px 8px;border-radius:8px;margin-left:.4rem;vertical-align:middle;}
.q-num{font-size:.78rem;color:var(--text-soft);margin-bottom:.4rem;}
.q-text{font-family:'Noto Serif TC',serif;font-size:1rem;color:var(--text);line-height:1.7;margin-bottom:1.2rem;}
.opts{list-style:none;display:flex;flex-direction:column;gap:.5rem;}
.opt-btn{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:.65rem .9rem;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;color:var(--text);cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:.6rem;}
.opt-btn:hover:not(:disabled){background:var(--highlight);border-color:var(--accent);transform:translateX(2px);}
.opt-key{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;background:var(--muted);color:#fff;font-size:.72rem;font-weight:500;flex-shrink:0;margin-top:2px;transition:background .15s;}
.opt-btn:hover:not(:disabled) .opt-key{background:var(--accent-dk);}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct);color:#2a4a35;}
.opt-btn.correct .opt-key{background:var(--correct);}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:#4a2a2a;}
.opt-btn.wrong .opt-key{background:var(--wrong);}
.opt-btn:disabled{cursor:default;}

.expl-box{display:none;margin-top:1rem;background:#eaf1f7;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:.9rem 1.1rem;font-size:.87rem;color:var(--text-soft);line-height:1.7;}
.expl-box.show{display:block;}
.expl-box strong{color:var(--accent-dkr);font-weight:500;}

/* nav */
.nav-area{display:flex;align-items:center;justify-content:space-between;margin-top:1.5rem;gap:.8rem;flex-wrap:wrap;}
.nav-btn{background:var(--accent-dkr);color:#deeaf2;border:none;border-radius:8px;padding:.6rem 1.3rem;font-family:'Noto Sans TC',sans-serif;font-size:.88rem;cursor:pointer;transition:all .15s;}
.nav-btn:hover{background:var(--accent-dk);transform:translateY(-1px);}
.nav-btn:disabled{background:var(--muted);cursor:default;transform:none;}
.counter{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:.35rem .9rem;font-size:.82rem;color:var(--text-soft);}

/* results */
.results{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2.5rem 2rem;text-align:center;}
.results.show{display:block;}
.score-ring{width:100px;height:100px;border-radius:50%;background:var(--accent-dkr);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1.2rem;}
.score-ring .sn{font-family:'Noto Serif TC',serif;font-size:1.6rem;color:#deeaf2;line-height:1;}
.score-ring .sl{font-size:.72rem;color:var(--muted);}
.results h2{font-family:'Noto Serif TC',serif;font-weight:400;font-size:1.3rem;color:var(--accent-dkr);margin-bottom:.4rem;}
.results p{color:var(--text-soft);font-size:.9rem;margin-bottom:1.2rem;}
.r-btn{background:var(--accent-dkr);color:#deeaf2;border:none;border-radius:8px;padding:.65rem 1.5rem;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;cursor:pointer;margin:.3rem;transition:background .15s;}
.r-btn:hover{background:var(--accent-dk);}
.r-btn.sec{background:transparent;border:1.5px solid var(--accent);color:var(--accent-dkr);}
.r-btn.sec:hover{background:var(--highlight);}

/* review */
.review-wrap{display:none;margin-top:1.5rem;text-align:left;}
.review-wrap.show{display:block;}
.rv-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1rem;}
.rv-status{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:500;margin-bottom:.4rem;}
.rv-status.c{color:#3a7a52;} .rv-status.w{color:#8a3a3a;}
.rv-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.rv-dot.c{background:var(--correct);} .rv-dot.w{background:var(--wrong);}
.rv-q{font-family:'Noto Serif TC',serif;font-size:.93rem;margin-bottom:.5rem;line-height:1.65;}
.rv-ans{font-size:.84rem;color:var(--text-soft);}
.rv-ans span{font-weight:500;color:var(--accent-dkr);}
.rv-expl{margin-top:.6rem;font-size:.84rem;color:var(--text-soft);background:var(--surface);padding:.65rem .9rem;border-radius:8px;border-left:2px solid var(--muted);line-height:1.65;}
.tag-sm{font-size:.7rem;background:var(--highlight);color:var(--accent-dkr);padding:2px 7px;border-radius:10px;margin-bottom:.5rem;display:inline-block;letter-spacing:.05em;font-weight:500;}

/* skipped */
.skipped-sec{margin-top:2.5rem;padding-top:2rem;border-top:1px solid var(--border);}
.skipped-sec h3{font-family:'Noto Serif TC',serif;font-weight:400;font-size:1.1rem;color:var(--accent-dkr);margin-bottom:.3rem;}
.skipped-sec .note{font-size:.82rem;color:var(--text-soft);margin-bottom:1rem;}
.sk-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.7rem;font-size:.88rem;}
.sk-q{font-family:'Noto Serif TC',serif;font-size:.92rem;color:var(--text);margin-bottom:.35rem;}
.sk-ans{font-size:.82rem;color:var(--text-soft);}
.sk-ans strong{color:var(--accent-dkr);font-weight:500;}
.sk-note{font-size:.76rem;color:#8aabba;margin-top:3px;font-style:italic;}

@media(max-width:600px){
  .header h1{font-size:1.3rem;}
  .q-card{padding:1.1rem 1.1rem;}
  .container{padding:1rem .8rem 3rem;}
}
</style>
</head>
<body>
<div class="header">
  <h1>生化完整題庫</h1>
  <p>Chapter 6 — Proteins &amp; Transport &nbsp;·&nbsp; Chapter 7 — Oxygen-Binding Proteins</p>
  <div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<div class="container">
  <div class="filter-bar">
    <label>篩選章節：</label>
    <button class="ch-btn active" onclick="filterChapter('all',this)">全部</button>
    <button class="ch-btn" onclick="filterChapter('6',this)">Chapter 6</button>
    <button class="ch-btn" onclick="filterChapter('7',this)">Chapter 7</button>
    <button class="ch-btn" onclick="filterChapter('exam',this)" style="border-color:#c8a96e;color:#7a5c1e;">📋 考卷10題</button>
  </div>
  <div class="stats-row">
    <div class="stat-pill">總題數：<strong id="totalCount">0</strong></div>
    <div class="stat-pill">已答：<strong id="answeredCount">0</strong></div>
    <div class="stat-pill">答對：<strong id="correctCount">0</strong></div>
  </div>

  <div id="quizArea"></div>
  <div class="nav-area" id="navArea">
    <button class="nav-btn" id="prevBtn" onclick="changeQ(-1)" disabled>← 上一題</button>
    <span class="counter" id="counterPill">1 / 0</span>
    <button class="nav-btn" id="nextBtn" onclick="changeQ(1)">下一題 →</button>
  </div>

  <div class="results" id="resultsPanel">
    <div class="score-ring"><span class="sn" id="scoreNum">0</span><span class="sl">答對</span></div>
    <h2 id="resultTitle">作答完成</h2>
    <p id="resultMsg"></p>
    <button class="r-btn" onclick="showReview()">查看詳解</button>
    <button class="r-btn sec" onclick="restartQuiz()">重新作答</button>
    <div class="review-wrap" id="reviewWrap"></div>
  </div>

  <div class="skipped-sec" id="skippedSec" style="display:none">
    <h3>需要圖片的題目（共 <span id="skCount">0</span> 題）</h3>
    <p class="note">以下題目原始版本需搭配圖表或圖片，答案與說明已整理供參考。</p>
    <div id="skippedList"></div>
  </div>
</div>

<script>
const ALL_Q = [
// ==================== CHAPTER 7 PART 1 ====================
{ch:"7",num:"7-1",
q:"Structurally, myoglobin and hemoglobin are very similar proteins. In which of the following levels of structure do they differ most?",
opts:["Tertiary structure","Quaternary structure","Primary structure","Secondary structure"],
ans:1,
expl:"Myoglobin（肌紅蛋白）是單一多肽鏈的 monomer，沒有 quaternary structure（四級結構）。Hemoglobin（血紅蛋白）則是由四個次單元（兩條 α 鏈和兩條 β 鏈）組成的 heterotetramer，具有 quaternary structure。這是兩者最大的結構差異所在。"},

{ch:"7",num:"7-2",
q:"Which of the following statements is FALSE? In its interaction with hemoglobin, oxygen is:",
opts:["reversibly bound","a homoallosteric effector","a prosthetic group","bound at the 6th coordination position of the Fe(II) ion in the heme","a ligand"],
ans:2,
expl:"氧氣（O₂）不是 prosthetic group（輔基）。Prosthetic group 是永久性地與蛋白質結合的非蛋白質分子，例如 heme（血基質）才是 hemoglobin 的 prosthetic group。O₂ 是可逆地結合到 heme 的 Fe(II) 離子的第六配位位置，屬於 ligand（配體）。它也是 homoallosteric effector，因為 O₂ 本身的結合會促進其他次單元對 O₂ 的親和力。"},

{ch:"7",num:"7-3",
q:"Which of the following amino acids has the most significant role in the molecular mechanisms of hemoglobin's function?",
opts:["glycine","tyrosine","histidine","lysine","glutamate"],
ans:2,
expl:"Histidine（組胺酸）在 hemoglobin 功能中扮演多重關鍵角色：\n① Proximal histidine（F8 位置）：與 heme 的 Fe(II) 形成 coordination bond（配位鍵），固定 heme 於蛋白質中。\n② Distal histidine（E7 位置）：位於氧氣結合側，與 O₂ 形成 hydrogen bond（氫鍵），穩定氧合狀態。\n③ Bohr effect（玻爾效應）：低 pH 時 histidine 側鏈被質子化，形成 salt bridges（鹽橋），穩定 T state（緊張態）。\n④ BPG binding（2,3-bisphosphoglycerate 結合）：質子化的 histidine 殘基參與與 BPG 的結合。"},

{ch:"7",num:"7-4",
q:"Which of the following statements about 2,3-bisphosphoglycerate (BPG) binding is FALSE?",
opts:["BPG binds less tightly to fetal hemoglobin than to adult hemoglobin, thereby aiding oxygen transfer to a fetus","BPG binds to hemoglobin at one site and lowers hemoglobin's affinity for oxygen at another site","BPG aids oxygen delivery to tissues by increasing the affinity of myoglobin for oxygen","BPG requires a binding site containing multiple positively charged groups"],
ans:2,
expl:"BPG 不會影響 myoglobin（肌紅蛋白）的 O₂ 親和力，因為 myoglobin 是 monomer，沒有 allosteric regulation（異位調控）機制，也沒有 BPG 結合位點。BPG 只作用於 hemoglobin：它結合於 deoxyhemoglobin（去氧血紅蛋白）的中央空腔，穩定 T state（低親和力狀態），促進 O₂ 在組織中的釋放。"},

{ch:"7",num:"7-5",
q:"Fetal hemoglobin has a higher affinity for oxygen than maternal hemoglobin. Which of the following statements correctly outlines the mechanism behind this observation?",
opts:["In fetal hemoglobin, the residue Ser143 is mutated to His143, and so the protein binds BPG with lower affinity","In fetal hemoglobin, the residue His143 is mutated to Ser143, and so the protein binds BPG with lower affinity","In fetal hemoglobin, the residue Ser143 is mutated to His143, and so the protein binds BPG with greater affinity","In fetal hemoglobin, the residue His143 is mutated to Ser143, and so the protein binds BPG with greater affinity"],
ans:1,
expl:"胎兒血紅蛋白（HbF）的 γ 鏈在第143位是 Serine（絲胺酸），而成人 β 鏈在同位置是 Histidine（組胺酸）。His143 帶正電荷，可與 BPG 的負電磷酸基形成 salt bridge。Ser143 不帶電荷，使中央空腔的正電荷減少，BPG 結合親和力降低。BPG 結合較少 → T state 較不穩定 → R state（高親和力狀態）比例較高 → HbF 對 O₂ 親和力更高 → 胎兒可從母體血液中有效奪取 O₂。"},

{ch:"7",num:"7-6",
q:"Which of the following statements correctly describes the interaction between an allosteric protein and an allosteric effector?",
opts:["The effector binds non-specifically to one subunit and through induced fit initiates cooperativity between the subunits","The effector binds reversibly at a specific site on one subunit of the protein, causing a global change in conformation","The effector activates the protein by causing it to switch from its T (low affinity) to R (high affinity) form","The effector binds covalently at a specific site on the protein, causing a global change in shape"],
ans:1,
expl:"Allosteric effector（異位效應分子）的特性：可逆（reversibly）地結合於蛋白質上特定的 allosteric site（異位結合位點），此位點不是 active site，但結合後會引起整個蛋白質的 conformational change（構型改變），進而影響其他結合位點的親和力。注意：allosteric effector 不一定使蛋白質從 T→R，也可能是負效應分子穩定 T state（如 BPG、H⁺）。"},

{ch:"7",num:"7-7",
q:"Which of the following statements about sickle cell anemia is FALSE?",
opts:["In sickle cell anemia, hemoglobin molecules aggregate to form long fibers that distort the shape of the red blood cell","The mutation in sickle cell anemia replaces a hydrophilic surface residue with a non-polar residue","Sickle cell anemia is a consequence of a conservative mutation in the β-globin gene","Sickle cell anemia is a genetic disease"],
ans:2,
expl:"鐮刀型細胞貧血症（sickle cell anemia）中，β-globin 基因第6位的 Glutamic acid（谷胺酸，帶負電、親水性）被替換為 Valine（纈胺酸，非極性、疏水性）。Glu → Val 並非 conservative mutation（保守性突變），因為 conservative mutation 指以性質相似的胺基酸替換（如負電換負電、或疏水換疏水）。這個突變將親水帶電殘基換成疏水殘基，性質差異很大，且嚴重影響蛋白質功能，完全不保守。"},

{ch:"7",num:"7-8",
q:"Which of the following triggers the transition from T state to R state (low to high affinity) in hemoglobin?",
opts:["oxygen binding","oxygen dissociation","subunit dissociation","movement of the proximal histidine","heme binding"],
ans:0,
expl:"當 O₂ 結合到 hemoglobin 的 T state（去氧型）時，O₂ 與 heme 的 Fe(II) 形成第六個配位鍵，使 Fe(II) 從偏出 porphyrin（卟啉）平面的位置被拉入平面內。這帶動了與 Fe(II) 形成配位鍵的 proximal histidine（F8）移動，進而帶動 F helix（F 螺旋），最終傳遞到次單元界面，引起 quaternary structure 的重排，即 T→R 的轉變（Perutz mechanism）。"},

{ch:"7",num:"7-9",
q:"Which of the following statements about the structure of myoglobin is FALSE?",
opts:["A heme prosthetic group is tightly bound to myoglobin via a coordination bond","Myoglobin contains all three types of secondary structure","Myoglobin contains a heme prosthetic group that is slotted into a hydrophobic pocket between α-helix E and α-helix F","The tertiary structure of myoglobin is a compact, roughly spherical shape"],
ans:1,
expl:"Myoglobin 的 secondary structure（二級結構）只有兩種：α-helix（α 螺旋，8條，占主體）和 loops（迴圈，連接各螺旋段）。Myoglobin 不含任何 β-sheet（β 折板）。所以說它含「三種 secondary structure」是錯誤的。Heme 確實插入 E 螺旋和 F 螺旋之間的 hydrophobic pocket（疏水性口袋）。"},

{ch:"7",num:"7-10",
q:"A newly-identified protein has a sigmoidal curve in a graph of fractional saturation versus ligand concentration. What can be deduced about this protein?",
opts:["The protein has primary, secondary and tertiary structure, but not quaternary","The protein binds the ligand cooperatively","The protein has a constant high affinity for the ligand","The dissociation constant (Kd) of the ligand is low"],
ans:1,
expl:"Sigmoidal（S 型）的結合曲線是 cooperative binding（協同結合）的典型標誌。當一個配體結合後，改變了其他結合位點的親和力（正協同性：親和力上升），就會產生 S 型曲線。Hyperbolic（雙曲線型）曲線才代表非協同性的獨立結合（如 myoglobin）。注意：光憑 sigmoidal 曲線不能確定蛋白質有 quaternary structure，但通常協同性需要多個次單元。"},

{ch:"7",num:"7-11",
q:"Which of the following is NOT a role of histidine in hemoglobin?",
opts:["Protonated histidine residues aid in BPG binding","The distal histidine occupies the 6th coordination position of Fe²⁺","Histidine residues become protonated as part of the Bohr effect","The proximal histidine occupies the 5th coordination position of Fe²⁺"],
ans:1,
expl:"Distal histidine（遠端組胺酸，E7 位置）並不佔據 Fe²⁺ 的第六配位位置——那個位置是由 O₂（可逆地）佔據的。Distal histidine 的真正功能是位於 O₂ 結合位點附近，與已結合的 O₂ 形成 hydrogen bond，同時阻擋 CO 以直線方式結合（CO 本來與 Fe²⁺ 結合親和力極高，但 distal histidine 空間阻礙使其親和力降低約 1000 倍，保護生物體）。Proximal histidine（F8）才是佔據第五配位位置。"},

{ch:"7",num:"7-12",
q:"Why does the concentration of BPG in red blood cells increase when humans are exposed to high altitudes?",
opts:["To allow hemoglobin to bind more oxygen at lower partial pressures of oxygen","To induce the production of more red blood cells","To neutralize the increased concentration of hydrogen ions produced when muscle works harder at high altitudes","To allow hemoglobin to release more oxygen at lower partial pressures of oxygen"],
ans:3,
expl:"在高海拔時，大氣 O₂ 分壓（pO₂）降低，肺部的 hemoglobin O₂ 飽和度下降，可攜帶到組織的總 O₂ 量減少。紅血球代償性地增加 BPG 濃度，BPG 與 deoxyhemoglobin 結合穩定 T state，降低 hemoglobin 對 O₂ 的親和力，使 O₂ 結合曲線右移，讓 hemoglobin 在組織中（即使 pO₂ 不低）也能釋放更多 O₂。這是一種快速的生理適應機制（數小時內即可作用）。"},

{ch:"7",num:"7-13",
q:"A newly-identified protein shows a sigmoidally-shaped curve in a graph of fractional saturation versus ligand concentration. Which of the following statements about that protein is TRUE?",
opts:["The protein does NOT bind the ligand cooperatively","The protein undergoes conformational changes in quaternary structure when the ligand binds","When the ligand binds to one subunit, the affinity of the other subunits for the same ligand remains the same","The ligand binds irreversibly at a specific site on the protein, causing a global change in shape"],
ans:1,
expl:"Sigmoidal 結合曲線代表 cooperative binding（協同結合），意味著一個 ligand 結合後，透過 quaternary structure（四級結構）的 conformational change，改變了其他次單元的親和力。因此，蛋白質必須有多個次單元（有 quaternary structure），且各次單元間有 conformational coupling（構型偶聯）。所以「当 ligand 結合引起 quaternary structure 的構型改變」是正確的。"},

{ch:"7",num:"7-14",
q:"If hemoglobin is in the 'T' state, what is the first component of the peptide chain that moves in response to oxygen binding?",
opts:["The heme group","The proximal histidine","The Fe²⁺ ion","The distal histidine"],
ans:1,
expl:"根據 Perutz mechanism，O₂ 結合到 heme Fe(II) 後，Fe(II) 被拉入 porphyrin 平面，而 Fe(II) 與 proximal histidine（F8）之間有 coordination bond，所以 Fe(II) 的移動直接帶動 proximal histidine 移動。proximal histidine 是蛋白質鏈的一部分，它的移動進一步帶動 F helix，最終引起整個次單元和 quaternary structure 的重排。所以第一個移動的多肽鏈成分是 proximal histidine。"},

{ch:"7",num:"7-15",
q:"One of the adaptations to high altitude is an increase in the concentration of BPG in red blood cells. What effect does this have on the oxygen binding curve of hemoglobin and why?",
opts:["The curve is shifted to the left because hemoglobin has a lower Kd (dissociation constant)","The curve is shifted to the right, because hemoglobin has a lower affinity for oxygen","The curve is shifted to the right, because hemoglobin has tighter oxygen binding","The curve is shifted to the left because hemoglobin binds oxygen more tightly"],
ans:1,
expl:"BPG 濃度增加 → 更多 BPG 與 deoxyhemoglobin 結合 → 穩定 T state（低親和力狀態）→ hemoglobin 對 O₂ 的親和力降低（Kd 增大，p50 增大）→ O₂ 結合曲線向右移（right shift）。右移意味著在相同 pO₂ 下，hemoglobin 的 O₂ 飽和度較低，即在組織中會釋放更多 O₂，有助於高海拔時補充組織 O₂ 供應。"},

{ch:"7",num:"7-16",
q:"Which of the following statements most accurately explains why hemoglobin is able to deliver oxygen to myoglobin in the tissues?",
opts:["The iron in the heme group of myoglobin is Fe³⁺, which has a higher affinity for oxygen","Myoglobin has a hyperbolic oxygen binding curve, whereas hemoglobin has a sigmoidal oxygen binding curve","The presence of BPG in the red blood cells shifts the equilibrium towards the R state of hemoglobin","The pH of tissue/muscle is always higher than that of blood, which aids hemoglobin in giving up its oxygen"],
ans:1,
expl:"Myoglobin 的 hyperbolic（雙曲線型）O₂ 結合曲線代表它對 O₂ 親和力高且穩定（沒有協同性）。Hemoglobin 的 sigmoidal（S 型）曲線則代表它在低 pO₂ 時能採取低親和力的 T state。在組織中（pO₂ 較低），hemoglobin 因 T state 比例高而釋放 O₂；myoglobin 因親和力始終高而能接收這些 O₂。S 型曲線使 hemoglobin 成為有效的「O₂ 搬運工」，而不是像 myoglobin 一樣緊抓 O₂ 不放。"},

{ch:"7",num:"7-17",
q:"Which of the following statements about hemoglobin is TRUE?",
opts:["The affinity of fetal hemoglobin for oxygen is higher than that of maternal hemoglobin","Hemoglobin differs from myoglobin because it contains more β-pleated sheet structure","In the Bohr effect the binding of oxygen to hemoglobin is increased by the presence of H⁺ ions and CO₂","Variations in the primary structure of hemoglobin always result in genetic diseases"],
ans:0,
expl:"胎兒血紅蛋白（HbF）對 O₂ 的親和力確實高於母體 hemoglobin（HbA），這是因為 HbF 的 γ 鏈在第143位是 Ser（而非 HbA β 鏈的 His），導致 BPG 結合親和力下降，T state 較不穩定，整體 O₂ 親和力上升。這一特性使胎兒能從母體血液中有效獲取 O₂。注意：Bohr effect 是 H⁺ 和 CO₂ 降低（而非增加）hemoglobin 對 O₂ 的親和力。"},

{ch:"7",num:"7-18",
q:"Why is BPG essential for the delivery of O₂ to the tissues?",
opts:["BPG stabilizes the R state conformation of hemoglobin","BPG stabilizes O₂ binding to hemoglobin","BPG stabilizes the association of hemoglobin subunits","BPG stabilizes the T state conformation of hemoglobin"],
ans:3,
expl:"BPG（2,3-bisphosphoglycerate）帶有多個負電荷，結合在 deoxyhemoglobin T state 的中央空腔，與多個帶正電殘基形成 electrostatic interactions（靜電交互作用），穩定 T state（低 O₂ 親和力構型）。T state 比例增加 → O₂ 更容易被釋放到組織 → 有效的 O₂ 輸送。沒有 BPG，hemoglobin 會傾向維持 R state（高親和力），在組織中就不會釋放足夠的 O₂。"},

{ch:"7",num:"7-19",
q:"Protein X binds reversibly to ligand Y such that X + Y ⇌ XY. If the molar concentrations of X, Y and XY are known, which of the following represents the dissociation constant (Kd) for this reaction?",
opts:["Kd = [X][Y]/[XY]","Kd = [XY]/[X][Y]","Kd = [X]+[Y]/[X+Y]","Kd = [XY]/[Y]","Kd could not be determined with the information provided"],
ans:0,
expl:"Dissociation constant（解離常數）Kd 的定義是反應 XY ⇌ X + Y 的平衡常數，即產物濃度乘積除以反應物濃度：Kd = [X][Y] / [XY]。Kd 越小，表示複合物越穩定，蛋白質對 ligand 的親和力越高。相對地，Association constant（結合常數）Ka = [XY] / [X][Y] = 1/Kd。"},

{ch:"7",num:"7-20",
q:"Which of the following statements is FALSE regarding the interaction of oxygen with myoglobin?",
opts:["Oxygen is a homoallosteric effector of myoglobin","Oxygen binds at the 6th coordination position of the Fe²⁺ ion in the heme","Oxygen is a ligand of myoglobin","Oxygen binds reversibly and with high affinity to the heme prosthetic group"],
ans:0,
expl:"Myoglobin 不是 allosteric protein（異位調控蛋白），因為它是 monomer（單體），只有一個 O₂ 結合位點，沒有多個次單元之間的 cooperativity。Homoallosteric effector 是指與蛋白質的正常結合位點相同的配體，能引起協同效應（如 hemoglobin 的 O₂）。Myoglobin 的 O₂ 結合是簡單的雙曲線型，不存在 allosteric regulation。"},

{ch:"7",num:"7-21",
q:"Which of the following occurs in hemoglobin when blood pH is lowered?",
opts:["The proximal histidine becomes charged at lower pH, which weakens the binding of heme in its pocket","Histidine side chains at the subunit interface are charged at lower pH, forming salt bridges that stabilize the T state","The distal histidine becomes charged at lower pH, resulting in a lower affinity of the heme","Hemoglobin binds BPG with reduced affinity because histidine side chains in the central cavity of hemoglobin are charged at lower pH"],
ans:1,
expl:"這就是 Bohr effect（玻爾效應）的分子機制：pH 降低時（即 H⁺ 濃度增加），次單元界面的 histidine 側鏈（尤其是 β146 His）被質子化而帶正電荷，能與附近的 Asp94 的負電荷形成 salt bridge（鹽橋）。這些 salt bridges 穩定了 T state（低 O₂ 親和力），促進 O₂ 的釋放。主動代謝的組織產生 CO₂ → 轉化為 H⁺ → 局部 pH 下降 → hemoglobin 釋放更多 O₂，形成一個精妙的供需匹配機制。"},

{ch:"7",num:"7-22",
q:"The binding of one O₂ to a molecule of hemoglobin results in:",
opts:["A decrease in hemoglobin's ability to bind a second O₂","The release of any other O₂ that may have bound earlier","Dissociation of the hemoglobin subunits","The movement of hemoglobin to an organism's muscle tissue","An increased affinity for O₂ in the remaining subunits (which have not yet bound O₂)"],
ans:4,
expl:"這是 positive cooperativity（正協同性）的核心原理。當 hemoglobin 處於 T state 時，第一個 O₂ 結合非常困難（親和力低）。但一旦結合，Fe(II) 拉入 porphyrin 平面，帶動 proximal histidine，引起次單元構型重排，整體蛋白質趨向 R state（高親和力）。因此，已結合 O₂ 的次單元會使其他次單元的 O₂ 親和力提高，形成「一個帶動全局」的協同效應，Hill coefficient（Hill 係數）約為 3。"},

{ch:"7",num:"7-23",
q:"Which of the following is TRUE about the distal histidine of hemoglobin?",
opts:["It is not conserved in myoglobin","It forms a strong covalent bond with the Fe²⁺ atom coordinated by heme","It prevents helix F from moving in response to oxygen binding","It forms a hydrogen bond with bound oxygen","It covalently bonds heme into the hemoglobin subunit"],
ans:3,
expl:"Distal histidine（E7，遠端組胺酸）在 O₂ 結合位點的頂部，當 O₂ 與 Fe(II) 結合後，distal histidine 的 N-H 可與 O₂ 形成 hydrogen bond（氫鍵）。這個氫鍵：① 穩定 O₂ 在結合位點的位置；② 阻礙 CO 以最佳（直線型）角度結合，使 CO 對 Fe(II) 的親和力大幅降低（從游離 heme 的 25000 倍降至約 250 倍），是生物體對抗 CO 毒性的機制之一。"},

{ch:"7",num:"7-24",
q:"Which of the following statements about the T and R states of hemoglobin is FALSE?",
opts:["The R state has a smaller central cavity than the T state","In the R state, the Fe²⁺ ion lies in the plane of the heme","The T state is less stable than the R state at lower pH","The T state has a lower affinity for oxygen than the R state"],
ans:2,
expl:"低 pH 代表高 H⁺ 濃度，H⁺ 使 histidine 被質子化，形成 salt bridges，穩定的是 T state（而非 R state）。因此說「低 pH 時 T state 較不穩定」是錯誤的。事實正好相反：低 pH 穩定 T state，這正是 Bohr effect 的基礎——在代謝活躍、pH 較低的組織中，hemoglobin 偏向 T state，釋放更多 O₂。R state 中央空腔較小（BPG 無法有效結合），且 Fe²⁺ 被拉入 porphyrin 平面。"},

{ch:"7",num:"7-25",
q:"Which of the following statements is FALSE?",
opts:["As pH decreases, the O₂ binding curve of hemoglobin shifts to the right, because a greater proportion of hemoglobin molecules exist in the T-state at a given pO₂","Actively respiring tissues have a relatively low pH and low pO₂, which favors the T-state of hemoglobin","In fetal hemoglobin the central cavity is lined with more histidines than in adult hemoglobin, which results in preferential stabilization of the R-state","Fetal hemoglobin has a weaker affinity for BPG than maternal hemoglobin, resulting in a shift of the oxygen-binding curve to the left"],
ans:2,
expl:"這題說「胎兒血紅蛋白中央空腔有更多 histidine，穩定 R state」是錯誤的。事實正好相反：成人 HbA 的 β 鏈在143位有 Histidine（帶正電，穩定 BPG 結合和 T state）；而 HbF 的 γ 鏈在同位置是 Serine（不帶電），所以 HbF 中央空腔的正電荷比 HbA 少，BPG 結合更弱，T state 較不穩定，R state 更被偏好，O₂ 親和力更高。"},

{ch:"7",num:"7-26",
q:"Which term best describes the histidine F8 residue in myoglobin and hemoglobin?",
opts:["Variable residue","Invariant residue","Conservatively substituted residue","Catalytic residue","Homologous residue"],
ans:1,
expl:"Histidine F8（proximal histidine）是所有已知的 globin 蛋白（包括 myoglobin 和 hemoglobin 的各種次單元，乃至不同物種的同源蛋白）中完全保守的殘基，稱為 invariant residue（不變殘基）。這是因為 proximal histidine 與 heme Fe(II) 之間的 coordination bond（配位鍵）是整個 O₂ 結合機制不可或缺的，一旦突變功能就完全喪失。"},

{ch:"7",num:"7-27",
q:"In what direction does the sigmoidal O₂ binding curve of hemoglobin shift due to an increase in pH?",
opts:["Shifts to the left","Shifts to the right","Does not shift","Becomes hyperbolic"],
ans:0,
expl:"pH 升高代表 H⁺ 濃度降低，histidine 去質子化，salt bridges 減少，T state 較不穩定，hemoglobin 趨向 R state（高 O₂ 親和力）。因此 O₂ 結合曲線向左移（left shift），代表在相同 pO₂ 下 O₂ 飽和度更高（hemoglobin 更容易結合 O₂）。反之，pH 降低（如活躍肌肉組織）→ 右移 → 釋放更多 O₂。這是 Bohr effect 的核心概念。"},

{ch:"7",num:"7-28",
q:"What type of binding curve is represented by oxygen binding to myoglobin?",
opts:["Sigmoidal curve","Hyperbolic curve","Exponential curve","Bell-shaped curve"],
ans:1,
expl:"Myoglobin 是 monomer，只有一個 O₂ 結合位點，結合行為符合簡單的 Michaelis-Menten 動力學，因此 O₂ 結合曲線為 hyperbolic（雙曲線型）。公式為 Y = pO₂ / (p50 + pO₂)，其中 Y 為 fractional saturation（分數飽和度），p50 為達到半最大飽和時的 pO₂（myoglobin 約 2.8 torr）。Myoglobin 的 p50 遠低於 hemoglobin（~26 torr），表示其 O₂ 親和力更高。"},

{ch:"7",num:"7-29",
q:"In what direction does an increase in BPG push the binding curve of oxygen to hemoglobin?",
opts:["Shifts to the left","Shifts to the right","Does not shift","Makes the curve hyperbolic"],
ans:1,
expl:"BPG 濃度增加 → 更多 BPG 與 deoxyhemoglobin 結合 → 穩定 T state → 降低 hemoglobin 對 O₂ 的親和力（p50 增大）→ O₂ 結合曲線向右移（right shift）。這表示在相同 pO₂ 下，hemoglobin 的 O₂ 飽和度更低，即在組織中可釋放更多 O₂。高海拔時 BPG 增加即為此目的。"},

{ch:"7",num:"7-30",
q:"Which of the following statements is FALSE with respect to hemoglobin's transition from the T state to the R state?",
opts:["BPG is not required to stabilize the R state","Helix F changes its secondary structure in response to oxygen binding","The Fe²⁺ ion is pulled into the plane of the heme prosthetic group when oxygen binds to hemoglobin in the T state","Contacts between side chains in the different subunits of hemoglobin change upon binding of oxygen to one subunit"],
ans:1,
expl:"F helix 在 T→R 轉換過程中確實移動了位置（translation 和 tilt 約 1 Ångström），但其 secondary structure（二級結構，即 α-helix 的骨架氫鍵模式）並未改變。只有位置（tertiary/quaternary structure 層面）改變了。這是一個重要區別：Perutz mechanism 描述的是 conformational change（構型改變），不是 secondary structure 的解折疊或重折疊。"},

{ch:"7",num:"7-31",
q:"During vigorous exercise, the pH of blood passing through skeletal muscle decreases. How does this decrease affect the behaviour of hemoglobin?",
opts:["It decreases O₂ binding to hemoglobin, because it decreases the binding of BPG","It increases O₂ binding to hemoglobin, because it increases the binding of BPG","It decreases O₂ binding to hemoglobin, because it increases the binding of BPG","It increases O₂ binding to hemoglobin, because it decreases the binding of BPG"],
ans:2,
expl:"劇烈運動中，肌肉產生大量 CO₂ 和乳酸，局部 pH 降低。pH 降低有兩個協同效應：① Bohr effect：H⁺ 使 histidine 質子化，穩定 T state，降低 O₂ 結合；② BPG 效應：低 pH 使 hemoglobin 中央空腔的 histidine 等殘基帶更多正電荷，增加 BPG 結合親和力，BPG 進一步穩定 T state，進一步降低 O₂ 結合。兩者共同作用，確保 O₂ 在最需要的地方（活躍肌肉）大量釋放。"},

{ch:"7",num:"7-32",
q:"Which of the following is NOT a ligand to the porphyrin ring Fe(II) ion in oxymyoglobin?",
opts:["His E7","His F8","Nitrogen atoms in the porphyrin ring","Oxygen","All are ligands"],
ans:0,
expl:"在 oxymyoglobin（氧合型肌紅蛋白）中，Fe(II) 總共有6個配位位置：\n① 4個位置：由 porphyrin ring 的四個 nitrogen atoms 佔據（在同一平面內）\n② 第5位置：由 proximal histidine F8 佔據（軸向，蛋白質側）\n③ 第6位置：由 O₂ 佔據（軸向，開放側）\nHis E7（distal histidine）並不直接與 Fe(II) 形成 coordination bond，它只是透過 hydrogen bond 與已結合的 O₂ 相互作用，所以它不是 Fe(II) 的 ligand。"},

{ch:"7",num:"7-33",
q:"Which gas does NOT bind to the porphyrin ring Fe(II) ion in myoglobin?",
opts:["NO","CO","CO₂","O₂","H₂S"],
ans:2,
expl:"CO₂（二氧化碳）不結合到 heme Fe(II) 的配位位置。CO₂ 在血液中的運輸主要是：① 溶於血漿；② 與 hemoglobin 的 N-terminal amino groups 形成 carbamate（胺基甲酸酯）；③ 由 carbonic anhydrase 催化轉換為 HCO₃⁻。而 NO、CO、O₂、H₂S 都能與 Fe(II) 形成 coordination bond（配位鍵）結合在 heme 的第六配位位置。"},

{ch:"7",num:"7-34",
q:"Myoglobin's secondary structure is primarily composed of ______.",
opts:["parallel β-sheets","antiparallel β-sheets","α-helices","Ω-loops","polyproline helices"],
ans:2,
expl:"Myoglobin 幾乎完全由 α-helices（8條，標記為 A 到 H 螺旋）組成，屬於「all-α protein」的典型例子。這8條 α-helix 圍繞中央的疏水性口袋（hydrophobic pocket）折疊，将 heme 包夾在 E 和 F 螺旋之間。Myoglobin 完全不含 β-sheet（β 折板），各螺旋段之間由短的 loop（迴圈）連接。"},

{ch:"7",num:"7-35",
q:"Myoglobin's primary physiological role is to facilitate oxygen ______.",
opts:["storage","metabolism","binding","reduction","diffusion"],
ans:4,
expl:"Myoglobin 的主要生理功能是促進 O₂ 在肌肉細胞內的 diffusion（擴散）——從細胞膜（capillary 側）向粒線體（O₂ 消耗地）的運輸。由於 O₂ 在水溶液中溶解度低且擴散慢，myoglobin 提供一個可逆的 O₂ 攜帶機制，大幅提升細胞內 O₂ 的有效擴散速率。儲存 O₂（如潛水哺乳動物）是次要功能。"},

{ch:"7",num:"7-36",
q:"If the gene for myoglobin is 'knocked out' in mice, the mice:",
opts:["have larger lungs","respire extremely rapidly","have dark brown muscle tissue","appear normal, with lighter colored muscle tissue","have their growth stunted"],
ans:3,
expl:"Myoglobin knockout（基因剔除）小鼠的表現比預期中正常得多，這表明有其他補償機制存在（如微血管密度增加等）。最明顯的表型差異是肌肉顏色：myoglobin 含有紅色的 heme，賦予肌肉紅色；沒有 myoglobin 的小鼠肌肉呈較淡的粉白色。這也驗證了 myoglobin 是肌肉紅色的主要來源。"},

{ch:"7",num:"7-37",
q:"Carbon monoxide binds to heme:",
opts:["with a higher affinity than oxygen","resulting in the oxidation of the Fe(II) to Fe(III)","in a manner that displaces carbon dioxide, causing CO₂ poisoning","from the side opposite oxygen, resulting in a brown colored heme","with a lower affinity than oxygen"],
ans:0,
expl:"CO（一氧化碳）與游離 heme 的結合親和力比 O₂ 高約 25,000 倍，與蛋白質中 heme 的親和力也比 O₂ 高約 250 倍（distal histidine 的空間位阻使 CO 親和力降低）。CO 結合後佔據第六配位位置，阻止 O₂ 結合，形成 carboxyhemoglobin（碳氧血紅蛋白），使血液失去攜氧能力。CO 不會氧化 Fe(II)→Fe(III)（那是 methemoglobin 形成的機制）。"},

{ch:"7",num:"7-38",
q:"Myoglobin and a single chain of hemoglobin have similar ______ structures.",
opts:["primary","secondary","tertiary","quaternary","none of the above"],
ans:2,
expl:"Myoglobin 和 hemoglobin 的單一條鏈（α 或 β 亞基）具有非常相似的 tertiary structure（三級結構），都採用所謂的 globin fold（球蛋白折疊）：由8條 α-helix 圍繞疏水性 heme-binding pocket 排列的特徵性3D折疊。儘管它們的 primary structure（一級結構，胺基酸序列）只有約20%相同，三維結構卻高度保守。Hemoglobin 的四個亞基組成一個 heterotetramer（quaternary structure），而 myoglobin 沒有 quaternary structure。"},

{ch:"7",num:"7-39",
q:"Hemoglobin is a heterotetramer. How many protomers are present in hemoglobin?",
opts:["0","1","2","3","4"],
ans:2,
expl:"Hemoglobin 是 heterotetramer（異型四聚體），由兩條 α 鏈和兩條 β 鏈組成（α₂β₂）。Protomer（原聚體）是指重複的結構單元，hemoglobin 有2個 protomers，每個 protomer 由一條 α 鏈和一條 β 鏈組成（αβ 二聚體）。兩個 protomers 透過 C₂ 軸的 rotational symmetry（旋轉對稱）相關聯，組成完整的四聚體。"},

{ch:"7",num:"7-40",
q:"Hemerythrin and hemocyanin are:",
opts:["human mutant hemoglobins with decreased oxygen affinity","hemoglobin variants that are found in animals at high altitude","synthetic derivatives of hemoglobin's heme group used in artificial blood substitutes","oxygen transport proteins found in invertebrates","tetrameric hemoglobin derivatives containing only α-chains"],
ans:3,
expl:"Hemerythrin（血紅素蛋白，存在於多毛蟲等無脊椎動物）和 hemocyanin（血藍蛋白，存在於章魚、蝦蟹等節肢動物和軟體動物）都是在無脊椎動物中負責 O₂ 運輸的蛋白質，與脊椎動物的 hemoglobin 在演化上完全獨立。Hemocyanin 使用 copper（銅）離子而非 iron（鐵）來結合 O₂，氧合時呈藍色（血液是藍色的）。"},

{ch:"7",num:"7-41",
q:"Max Perutz's investigation of the structure of hemoglobin primarily utilized:",
opts:["X-ray crystallography","NMR spectroscopy","genomics","mass spectrometry","genetic engineering"],
ans:0,
expl:"Max Perutz（馬克斯·佩魯茨）從1937年起花費25年，使用 X-ray crystallography（X 射線晶體學）解析 hemoglobin 的三維結構，於1959年成功，並於1962年獲得諾貝爾化學獎（與解析 myoglobin 結構的 John Kendrew 共同獲獎）。Perutz 不僅解析了結構，還提出了 Perutz mechanism 來解釋 cooperative O₂ binding 的分子基礎，是結構生物學的奠基工作。"},

{ch:"7",num:"7-42",
q:"The oxygen binding by hemocyanins is mediated by:",
opts:["an iron ion","a pair of iron ions","a heme group","a copper atom","a pair of copper atoms"],
ans:4,
expl:"Hemocyanin（血藍蛋白）使用一對 copper atoms（兩個 Cu⁺ 離子）來結合一個 O₂ 分子。O₂ 結合後，兩個 Cu⁺ 被氧化為 Cu²⁺，O₂ 被還原成 peroxide（O₂²⁻），形成 met-hemocyanin，同時顏色從無色（deoxy）變為藍色（oxy）。這與使用單個 Fe²⁺/heme 的 myoglobin 和 hemoglobin 完全不同，是趨同演化（convergent evolution）的例子。"},

{ch:"7",num:"7-43",
q:"When the partial pressure of O₂ in venous blood is 30 torr, the saturation of myoglobin with O₂ is ______ while the saturation of hemoglobin with O₂ is ______.",
opts:["0.55, 0.91","0.91, 0.55","2.8 torr, 26 torr","0.91, 0.97","none of the above"],
ans:1,
expl:"利用公式計算（myoglobin p50 ≈ 2.8 torr；hemoglobin p50 ≈ 26 torr，靜脈血 pO₂ ≈ 30 torr）：\nMyoglobin：Y = 30/(2.8+30) ≈ 30/32.8 ≈ 0.91（91% 飽和）\nHemoglobin：p50=26，pO₂=30，從 sigmoidal 曲線估計約 0.55（55% 飽和）\n這體現了關鍵的生理意義：在同樣的靜脈血 pO₂ 下，myoglobin 高度飽和（能接收 O₂），而 hemoglobin 部分不飽和（已釋放 O₂ 給組織）。"},

{ch:"7",num:"7-44",
q:"Hemoglobin's p50 value is about ______ as great as myoglobin's p50 value.",
opts:["one-tenth","half","twice","ten times","twenty times"],
ans:3,
expl:"P50 是指 O₂ 飽和度達到50%時所需的 pO₂，反映 O₂ 親和力（p50 越小，親和力越高）。Myoglobin 的 p50 ≈ 2.8 torr；Hemoglobin 的 p50 ≈ 26 torr（正常生理條件下）。26 ÷ 2.8 ≈ 9.3，約為 myoglobin 的 10 倍。因此 hemoglobin 的 p50 約是 myoglobin 的10倍，表示 hemoglobin 對 O₂ 的整體親和力低於 myoglobin，這正是 hemoglobin 能在組織中釋放 O₂ 給 myoglobin 的基礎。"},

{ch:"7",num:"7-45",
q:"The value of n, the Hill constant (coefficient), for hemoglobin is about ______ as great as the value for myoglobin.",
opts:["half","twice","three times","five times","ten times"],
ans:2,
expl:"Hill coefficient（Hill 係數）n 反映協同性程度：n=1 表示無協同性（myoglobin），n>1 表示正協同性。Myoglobin 的 n = 1（單結合位點，hyperbolic 曲線）。Hemoglobin 的 n ≈ 3（最大可能值為4，等於結合位點數），表示強烈的正協同性（sigmoidal 曲線）。因此 hemoglobin 的 Hill coefficient 約為 myoglobin 的3倍。n 越大，曲線越陡峭（越像開關），O₂ 的裝載和釋放越有效率。"},

{ch:"7",num:"7-46",
q:"Consider a hypothetical hemoglobin-like molecule with a Hill coefficient of 1 and the same p50 value as normal hemoglobin. Choose the statement below that best describes the two proteins.",
opts:["There is a cooperative interaction between oxygen-binding sites in both the hypothetical and normal hemoglobins","The hypothetical hemoglobin has a greater oxygen affinity than normal hemoglobin","The oxygen binding curve for the hypothetical hemoglobin is hyperbolic, and the curve for normal hemoglobin is sigmoidal","The two hemoglobins would be able to deliver about the same amount of oxygen to the tissues","At pO₂ less than p50, normal hemoglobin has a greater YO₂ value"],
ans:2,
expl:"Hill coefficient n=1 代表無協同性結合，O₂ 結合曲線為 hyperbolic（雙曲線型）；正常 hemoglobin 的 n≈3，曲線為 sigmoidal（S 型）。兩者 p50 相同（O₂ 親和力相同點）。但在 pO₂ < p50 時，hyperbolic 曲線的飽和度高於 sigmoidal 曲線（S 型在低 pO₂ 時有一段「延遲」），在 pO₂ > p50 時則相反。因此，具有 sigmoidal 曲線的正常 hemoglobin 能在肺部（高 pO₂）裝載更多 O₂，並在組織（低 pO₂）釋放更多 O₂，運輸效率更高。"},

{ch:"7",num:"7-47",
q:"The Hill plot shows that the fourth oxygen binds to hemoglobin with a ______-fold greater affinity than the first.",
opts:["2","5","10","20","100"],
ans:4,
expl:"根據 Hill plot 分析，hemoglobin 的第四個 O₂ 結合親和力比第一個高約100倍。這驚人的放大效應正是 positive cooperativity（正協同性）的力量：T state（低親和力）被第一個 O₂ 逐漸轉換成 R state（高親和力），到第四個 O₂ 時，幾乎所有 hemoglobin 都已處於 R state，結合能力大幅增強。這使 hemoglobin 能在肺部（高 pO₂）高效裝載，在組織（低 pO₂）高效卸載。"},

{ch:"7",num:"7-48",
q:"While the binding of O₂ to myoglobin as a function of pO₂ is described by a simple ________ curve, the binding to hemoglobin is described by a more complex ______ curve.",
opts:["sigmoidal; hyperbolic","hyperbolic; sigmoidal","exponential; hyperbolic","sigmoidal; bell-shaped","hyperbolic; concave"],
ans:1,
expl:"Myoglobin（monomer，單結合位點）的 O₂ 結合曲線是 hyperbolic（雙曲線型），遵循簡單的 Michaelis-Menten 動力學。Hemoglobin（tetramer，四個結合位點，具有 positive cooperativity）的 O₂ 結合曲線是 sigmoidal（S 型）。Sigmoidal 曲線在生理 pO₂ 範圍內變化更陡峭，意味著 hemoglobin 在肺（高 pO₂）和組織（低 pO₂）之間的 O₂ 飽和度差值更大，O₂ 運輸效率更高。"},

{ch:"7",num:"7-49",
q:"The Bohr effect refers to:",
opts:["the decrease in affinity of Hb for O₂ when the pH goes down","the decrease in affinity of Hb for O₂ when the pH goes up","the increase in the affinity of Hb for O₂ when the O₂ concentration goes up","the decrease in affinity of Hb for O₂ when the BPG concentration goes up","the decrease in affinity of Hb for O₂ when the BPG concentration goes down"],
ans:0,
expl:"Bohr effect（玻爾效應，1904年由 Christian Bohr 發現）：當血液 pH 降低（H⁺ 濃度增加）時，hemoglobin 對 O₂ 的親和力降低，O₂ 結合曲線向右移。分子機制：H⁺ 使 hemoglobin 次單元界面的 histidine（如 β146-His）質子化，形成 salt bridges，穩定 T state。生理意義：在代謝活躍的組織（CO₂↑→H⁺↑→pH↓），hemoglobin 釋放更多 O₂；在肺部（CO₂↓→pH↑），hemoglobin 裝載更多 O₂。"},

{ch:"7",num:"7-50",
q:"Which of the following increases the affinity of hemoglobin for O₂?",
opts:["an increase in BPG concentration","the formation of N-terminal carbamates","an increase in pH","a decrease in pH","an increase in CO₂ concentration"],
ans:2,
expl:"pH 升高（即 H⁺ 濃度降低）→ histidine 去質子化 → salt bridges 減少 → T state 不穩定 → hemoglobin 趨向 R state → O₂ 親和力增加 → O₂ 結合曲線左移。反之，BPG 增加、CO₂ 增加、N-terminal carbamate 形成（CO₂ 與末端氨基反應，穩定 T state）、pH 降低，都會降低 hemoglobin 對 O₂ 的親和力（右移）。"},

{ch:"7",num:"7-51",
q:"The most rapid way that erythrocytes adapt to high altitudes is:",
opts:["by producing genetically altered hemoglobins that have higher O₂-binding affinities","by adopting the symmetry model of allosterism","by increasing the concentration of hemoglobin","by relying upon the simpler protein myoglobin","by increasing the intracellular concentration of BPG"],
ans:4,
expl:"在高海拔的早期適應（數小時內）中，最快速的機制是紅血球增加胞內 BPG（2,3-bisphosphoglycerate）濃度。BPG 由糖解途徑的中間產物合成，其濃度可以很快調節。BPG 增加 → O₂ 曲線右移 → hemoglobin 在組織中釋放更多 O₂。長期適應（數週）才會涉及 erythropoietin（促紅血球生成素）增加、紅血球數量增加等機制。"},

{ch:"7",num:"7-52",
q:"The rearrangement of T state hemoglobin to the R state involves:",
opts:["occurs in each protein subunit independently when its heme binds oxygen","requires the binding of at least three oxygen molecules","increases the ion pairing interactions of the C-terminal amino acids","involves the movement of the Fe(II) into the heme plane","opens a central cavity for BPG binding"],
ans:3,
expl:"T→R 轉換的關鍵步驟：O₂ 結合 Fe(II) → Fe(II) 被拉入 porphyrin 平面（因為 O₂ 結合使 Fe 的電子構型改變，ionic radius 縮小）→ Fe(II) 帶動 proximal histidine（F8）移動 → F helix 移動 → 次單元界面構型改變 → salt bridges（C-terminal 殘基的離子對）被破壞 → T→R 轉換。R state 中央空腔縮小（BPG 無法有效結合），而非「打開」。"},

{ch:"7",num:"7-53",
q:"Which of the following statements about the symmetry model of allosterism is NOT true?",
opts:["the protein is an oligomer of symmetrically (or pseudosymmetrically) related subunits","the oligomer can exist in two conformational states, which are in equilibrium","the ligand can bind to a subunit in either conformation","the molecular symmetry of the protein is conserved during the conformational change","none of the above"],
ans:4,
expl:"Monod-Wyman-Changeux（MWC）symmetry model（對稱模型）的所有基本假設都是正確的：① 蛋白質是有對稱性的寡聚體；② 可在 T 和 R 兩個構型態之間平衡；③ ligand 可結合任一構型的次單元；④ 最關鍵的是「對稱性保守」原則——所有次單元同步轉換（要麼全是 T，要麼全是 R），整體對稱性不變。這與 sequential model（順序模型）不同，後者允許不同次單元處於不同狀態。所以「none of the above（以上皆非錯誤）」是正確答案。"},

{ch:"7",num:"7-54",
q:"BPG stands for:",
opts:["biphenylglycine","boronylphenylglutamate","bisphosphoglycerate","bisphenylglycerol","betapropylglutamine"],
ans:2,
expl:"BPG = 2,3-bisphosphoglycerate（2,3-雙磷酸甘油酸）。它由糖解途徑（glycolysis）中的1,3-bisphosphoglycerate 經 bisphosphoglycerate mutase 催化轉化而來。BPG 帶有5個可解離的質子，在生理 pH 下帶約4個負電荷，與 deoxyhemoglobin T state 中央空腔的正電荷殘基（Val1-NH₃⁺、His2、Lys82、His143 × 2）形成多個靜電交互作用。"},

{ch:"7",num:"7-55",
q:"Why is the decreased affinity of fetal hemoglobin for BPG advantageous?",
opts:["With fewer BPG molecules bound there are more heme residues available for O₂ binding","Decreased BPG binding biases the fetal hemoglobin toward the R state","More free BPG is available to bind to adult hemoglobin, resulting in a shift to the R state","BPG is available to bind to fetal myoglobin, helping to release O₂ in fetal muscle tissue","None of the above"],
ans:1,
expl:"HbF 對 BPG 親和力低的優勢：BPG 結合少 → T state 穩定性降低 → HbF 趨向 R state（高 O₂ 親和力狀態）→ 在相同 pO₂ 下，HbF 比 HbA 的 O₂ 飽和度更高（O₂ 曲線左移）→ 胎兒能從胎盤中母體的 HbA 獲取 O₂（胎盤中 pO₂ 是母胎血之間的中間值）。這是一個精妙的演化設計，確保胎兒 O₂ 供應。"},

{ch:"7",num:"7-56",
q:"The reaction of carbonic anhydrase catalyzes:",
opts:["the formation of carbamates with the concomitant release of protons","the hydration of bicarbonate, resulting in the formation of carbonic acid","the reduction of carbon dioxide with the concomitant consumption of protons","the hydration of carbon dioxide, forming bicarbonate and protons","the hydrolysis of carbamates with the concomitant consumption of protons"],
ans:3,
expl:"Carbonic anhydrase（碳酸酐酶）催化：CO₂ + H₂O ⇌ HCO₃⁻ + H⁺。此反應在紅血球中將 CO₂ 快速轉換為 bicarbonate（碳酸氫根），HCO₃⁻ 可運出紅血球進入血漿（Cl⁻/HCO₃⁻ exchange），大幅增加血液的 CO₂ 攜帶量。同時產生的 H⁺ 觸發 Bohr effect，促進 O₂ 在組織中的釋放。在肺部，反應逆向進行，將 HCO₃⁻ 轉換回 CO₂ 排出。"},

{ch:"7",num:"7-57",
q:"During the T to R conformational shift, Fe(II) drags the F helix via a bond to the side chain of ________.",
opts:["Leu F7","Leu F4","His F8","Leu FG3","Val FG5"],
ans:2,
expl:"在 T→R 轉換中，O₂ 結合使 Fe(II) 從偏出 porphyrin 平面的位置被拉入平面。Fe(II) 通過 coordination bond（配位鍵）連接到 proximal histidine F8（His F8）的 imidazole 氮。Fe(II) 移動 → 直接拉動 His F8 → His F8 是 F helix 的一部分 → F helix 隨之移動（傾斜和平移約1 Å）→ 帶動次單元界面的重排 → T→R 轉換。這是 Perutz mechanism 的核心鏈。"},

{ch:"7",num:"7-58",
q:"In sickle-cell anemia, the negatively charged glutamic acid residue is replaced by the neutral amino acid ______.",
opts:["tyrosine","lysine","valine","adenosine","glycine"],
ans:2,
expl:"鐮刀型細胞貧血症（sickle cell anemia）中，β-globin 基因的第6位密碼子由 GAG（Glu，麩胺酸，帶負電）突變為 GTG（Val，纈胺酸，非極性疏水）。這個 Glu→Val 突變在 HbS 表面創造一個疏水性「黏性」位點，能嵌入相鄰 deoxyhemoglobin 分子 EF 段的疏水性口袋（Ala70 和 Phe85 之間），形成長纖維，使紅血球變形為鐮刀狀，導致溶血性貧血和血管阻塞。"},

{ch:"7",num:"7-59",
q:"Hemoglobin S, the variant responsible for sickle-cell anemia, is potentially advantageous to heterozygotes because it confers some level of resistance to the disease ________.",
opts:["rickets","AIDS","cyanosis","polycythemia","malaria"],
ans:4,
expl:"Sickle cell trait（鐮刀型細胞特徵，帶一個 HbS 等位基因的雜合子）對 malaria（瘧疾）有部分保護作用。Plasmodium falciparum（惡性瘧原蟲）寄生在紅血球中，帶有 HbS 的紅血球更容易在缺氧時裂解，使寄生蟲無法完成生命周期。這解釋了為何在瘧疾流行的撒哈拉以南非洲地區，鐮刀型細胞等位基因頻率較高（balancing selection，平衡選擇）。"},

{ch:"7",num:"7-60",
q:"______ of the world's human population carries an inherited variant hemoglobin gene.",
opts:["5%","25%","50%","75%","90%"],
ans:0,
expl:"全球約5%的人口攜帶遺傳性異常 hemoglobin 基因（包括 sickle cell trait、thalassemia 等各種 hemoglobin 變異）。其中鐮刀型細胞特徵在某些非洲族群中攜帶率可高達40%。儘管5%看起來不多，在全球80億人口中仍代表約4億人，是最常見的單基因遺傳疾病群之一。"},

{ch:"7",num:"7-61",
q:"What is the fractional saturation of myoglobin at pO₂ = 7.2 torr, if P50 = 2.8 torr?",
opts:["0.28","0.50","0.72","1.00"],
ans:2,
expl:"Myoglobin 的 fractional saturation（分數飽和度）公式為：\nY = pO₂ / (P50 + pO₂)\n代入數值：Y = 7.2 / (2.8 + 7.2) = 7.2 / 10.0 = 0.72\n即 72% 飽和。注意：由於 myoglobin 的 P50 很低（2.8 torr），在靜脈血的 pO₂（約30 torr）下幾乎完全飽和（≈91%），確保肌肉組織有充足的 O₂ 供應。"},

{ch:"7",num:"7-62",
q:"Noncooperative binding is characterized by a Hill coefficient of what value?",
opts:["n = 0","n = 1","n > 1","0 < n < 1"],
ans:1,
expl:"Hill coefficient（Hill 係數）n 的意義：\n• n = 1：非協同性結合（noncooperative），獨立結合位點，hyperbolic 曲線（如 myoglobin）\n• n > 1：正協同性（positive cooperativity），sigmoidal 曲線（如 hemoglobin，n ≈ 3）\n• 0 < n < 1：負協同性（negative cooperativity），一個 ligand 結合後降低其他位點的親和力\n• n 的最大理論值等於結合位點數（hemoglobin 最大為4）"},

{ch:"7",num:"7-63",
q:"Within the sequence of steps in the Perutz mechanism, select the position of the step 'His F8 is pulled towards the heme':\n(Steps: 1.Oxygen binds to deoxyhemoglobin, 2.Fe(II) is pulled into plane of porphyrin, 3.His F8 is pulled towards the heme, 4.Helix F tilts and is translated by ~1Å, 5.Residues at α-β interfaces move, ion pairs broken)",
opts:["First","Second","Third","Fourth","Fifth"],
ans:2,
expl:"Perutz mechanism 的正確步驟順序：\n① O₂ 結合到 deoxyhemoglobin → ② Fe(II) 被拉入 porphyrin 平面 → ③ His F8（與 Fe 有配位鍵）被拉向 heme → ④ F helix 傾斜並平移約1 Å → ⑤ α-β 次單元界面的殘基移動，C-terminal 的 ion pairs（鹽橋）被打破 → T→R 轉換完成。His F8 被拉動是第三步。"},

{ch:"7",num:"7-64",
q:"Within the Perutz mechanism, select the position of the step 'Residues at the α-β interfaces move, and ion pairs involving the C-terminal residues are broken':\n(Steps: 1.O₂ binds, 2.Fe(II) into plane, 3.His F8 pulled, 4.Helix F tilts ~1Å, 5.α-β interface residues move, ion pairs broken)",
opts:["First","Second","Third","Fourth","Fifth"],
ans:4,
expl:"Perutz mechanism 第五步（最後一步）：F helix 的移動傳遞到 α-β 次單元界面（α₁β₂ 和 α₂β₁ 界面，是 T→R 轉換中移動最大的界面），界面殘基重新排列，C-terminal 的 salt bridges（ion pairs）被破壞，包括 Asp94α-Asn102β 氫鍵改變（從 T state 的 Asp94α-Asn102β 變為 R state 的 Asp94α-Asn102β，β-146 His 的鹽橋解除），整個四聚體從 T state 切換到 R state。"},

{ch:"7",num:"7-65",
q:"Within the Perutz mechanism, select the position of the step 'Oxygen binds to deoxyhemoglobin':\n(Steps listed in no particular order)",
opts:["First","Second","Third","Fourth","Fifth"],
ans:0,
expl:"O₂ 結合到 deoxyhemoglobin 是 Perutz mechanism 的第一步，也是整個級聯反應的起始事件。在 T state 中，Fe(II) 位於 porphyrin 平面外（偏向 proximal histidine 側約0.4 Å），此時幾何構型不完全適合 O₂ 結合（是 T state 低親和力的原因之一）。但一旦 O₂ 與 Fe(II) 結合，Fe(II) 的電子構型改變（spin state 改變），ionic radius 縮小，Fe(II) 即被拉入平面，啟動後續級聯。"},

{ch:"7",num:"7-66",
q:"Within the Perutz mechanism, select the position of the step 'Helix F tilts and is translated by about 1 Angstrom':\n(Steps: 1.O₂ binds, 2.Fe(II) into plane, 3.His F8 pulled, 4.Helix F tilts, 5.α-β interfaces move, ion pairs broken)",
opts:["First","Second","Third","Fourth","Fifth"],
ans:3,
expl:"Perutz mechanism 第四步：His F8 被 Fe(II) 拉動後，帶動其所在的 F helix 發生傾斜（tilt）並平移（translation）約1 Å。F helix 與 FG corner（F-G 螺旋之間的轉角）相連，FG corner 進而與次單元界面的關鍵殘基相接觸，將 F helix 的微小移動放大並傳遞到 α-β 界面，最終觸發整個 quaternary structure 的 T→R 轉換。"},

{ch:"7",num:"7-67",
q:"Within the Perutz mechanism, select the position of the step 'Fe(II) is pulled into the plane of the porphyrin':\n(Steps: 1.O₂ binds, 2.Fe(II) into plane, 3.His F8 pulled, 4.Helix F tilts, 5.α-β interfaces move, ion pairs broken)",
opts:["First","Second","Third","Fourth","Fifth"],
ans:1,
expl:"Perutz mechanism 第二步：O₂ 結合到 Fe(II) 後，Fe(II) 的 spin state 從 high-spin（自旋態高，ionic radius 較大，偏出平面）改變為 low-spin（自旋態低，ionic radius 縮小），使 Fe(II) 可以被拉入 porphyrin 的中央平面。這個從「偏出平面」到「在平面內」的微小移動（約0.4 Å）是整個 cooperativity 機制的物理觸發器。"},

{ch:"7",num:"7-68",
q:"What are the two conformations of hemoglobin?",
opts:["The T state (deoxyhemoglobin) and the R state (oxyhemoglobin)","The R state (deoxyhemoglobin) and the T state (oxyhemoglobin)","The T state (dideoxyhemoglobin) and the R state (deoxyhemoglobin)","The T state (myoglobin) and the R state (deoxyhemoglobin)"],
ans:0,
expl:"Hemoglobin 在兩個主要構型態之間平衡：\n• T state（Tense state，緊張態）= deoxyhemoglobin（去氧血紅蛋白）：低 O₂ 親和力，次單元界面有多個 salt bridges 和 ion pairs，中央空腔較大（可容納 BPG），Fe(II) 偏出 porphyrin 平面。\n• R state（Relaxed state，鬆弛態）= oxyhemoglobin（氧合血紅蛋白）：高 O₂ 親和力，salt bridges 解除，中央空腔縮小，Fe(II) 在 porphyrin 平面內。\n兩態之間的轉換由 O₂、H⁺、CO₂ 和 BPG 調控。"},

{ch:"7",num:"7-69",
q:"How does BPG decrease the affinity of hemoglobin for oxygen?",
opts:["BPG reacts with oxygen to produce bicarbonate","BPG binding to hemoglobin stabilizes the oxy conformation","BPG blocks the oxygen binding sites directly","BPG binding to hemoglobin stabilizes the deoxy conformation"],
ans:3,
expl:"BPG 透過穩定 deoxy conformation（即 T state）來降低 hemoglobin 對 O₂ 的親和力：BPG 分子插入 deoxyhemoglobin 的中央空腔，與4條 polypeptide chain（兩條 β 鏈）的帶正電殘基（Val1、His2、Lys82、His143）形成多個 electrostatic interactions（靜電交互作用），將 T state「鎖住」，使 T→R 轉換更困難，O₂ 的結合更不容易，O₂ 親和力降低。"},

{ch:"7",num:"7-70",
q:"Which of the following is NOT one of the rules that defines the symmetry model (MWC model) of allosterism?",
opts:["An allosteric protein is an oligomer of symmetrically related subunits","Each subunit can exist in two conformational states, R and T, which are in equilibrium","The ligand can bind to a subunit in either conformation. Only the conformational change alters the affinity for ligand","Ligand binding induces a conformational change in the subunit to which it binds"],
ans:3,
expl:"MWC 對稱模型（Monod-Wyman-Changeux model）的規則：\n① 蛋白質是有對稱性的寡聚體 ✓\n② 每個次單元可存在 T 和 R 兩個構型態並保持平衡 ✓\n③ Ligand 可結合任一構型，但構型改變才影響親和力 ✓\n④ 對稱性保守：整個分子同步轉換（「all-or-nothing」）✓\n「Ligand binding induces a conformational change in the subunit to which it binds」是 sequential model（Koshland 的順序模型）的概念，不屬於 MWC 對稱模型。在 MWC 模型中，兩個構型態預先存在並平衡，ligand 只是選擇性地穩定其中一個。"},

{ch:"7",num:"7-71",

ans:1,
expl:"利用公式：Y = pO₂ / (p50 + pO₂) = 2.8 / (2.8 + 2.8) = 2.8 / 5.6 = 0.50（即50%飽和）。這是 p50 的定義：當 pO₂ 等於 p50 時，fractional saturation 恰好為0.5（50%）。這個道理類似 Km 的定義——Km 是達到最大反應速率一半時的底物濃度。"},

{ch:"7",num:"7-72",
q:"Shown below are statements matching scientists with their accomplishments. Which of the statements is INCORRECT?",
opts:["Joseph Barcroft: In 1921 he anticipated the existence of BPG as a factor that decreased the oxygen affinity of hemoglobin","Christian Bohr: In 1904 he reported the release of protons upon oxygen binding by hemoglobin","Max Perutz: In 1945 hypothesized and in 1949 proved that sickle-cell anemia was the result of a mutant hemoglobin (this was Linus Pauling's work)","Daniel Koshland: Proposed the sequential model of allosterism","Jacques Monod: Formulated the symmetry model of allosterism"],
ans:2,
expl:"這個題目的錯誤陳述是將「鐮刀型細胞貧血症是由突變的 hemoglobin 導致」的發現歸給 Max Perutz。實際上，這個發現是 Linus Pauling（萊納斯·鮑林）在1949年做出的——他使用電泳（electrophoresis）證明 HbS 帶電量與 HbA 不同，首次將疾病與蛋白質分子結構異常連結，開創了「分子疾病（molecular disease）」的概念。Max Perutz 的貢獻是用 X-ray crystallography 解析 hemoglobin 的三維結構。"},

{ch:"7",num:"7-73",
q:"Which of the following diseases is NOT caused by a mutation in hemoglobin?",
opts:["Polycythemia","Sickle-cell anemia","Hemolytic anemia","Hemophilia"],
ans:3,
expl:"Hemophilia（血友病）是由凝血因子（clotting factors）基因突變導致的疾病，與 hemoglobin 無關。它是 X-linked recessive（X 染色體隱性遺傳），最常見的是 Factor VIII（血友病A）或 Factor IX（血友病B）基因突變，導致凝血功能障礙。而 polycythemia（紅血球增多症）、sickle-cell anemia（鐮刀型細胞貧血症）、hemolytic anemia（溶血性貧血，如 thalassemia）都可以由 hemoglobin 基因突變引起。"},

{ch:"7",num:"7-74",
q:"Which of the statements about hemoglobin and myoglobin's oxygen binding is INCORRECT?",
opts:["The p50 of hemoglobin is nearly 10 times higher than that of myoglobin","The Hill coefficient increases with cooperativity: n=1 means no cooperativity, n<1 means negative cooperativity, n>1 means positive cooperativity","The sigmoidal curve of hemoglobin vs hyperbolic of myoglobin is because hemoglobin is a tetramer while myoglobin is a monomer","Myoglobin has a higher affinity for oxygen than hemoglobin","Hemoglobin has a Hill coefficient >1 whereas myoglobin has a Hill coefficient <1"],
ans:4,
expl:"錯誤的陳述是「hemoglobin 的 Hill coefficient > 1，而 myoglobin 的 Hill coefficient < 1」。Myoglobin 的 Hill coefficient = 1（不是 < 1），因為它是 monomer，O₂ 結合完全獨立，無協同性（n=1 表示非協同性）。n < 1 才代表負協同性（negative cooperativity），myoglobin 不屬於此類。Hemoglobin 的 n ≈ 3（正協同性，n > 1）是正確的。"},

{ch:"7",num:"7-75",
q:"What is the type of symmetry that relates the protomers in hemoglobin with respect to each other?",

expl:"Hemoglobin 的兩個 protomers（αβ 二聚體）透過 C₂ 旋轉對稱（180° 旋轉對稱軸）相互關聯：繞著通過分子中心的 C₂ 軸旋轉180°，兩個 protomers 互換。整個 hemoglobin 四聚體的對稱性是 D₂（有三個互相垂直的 C₂ 軸），但 protomers 之間（α₁β₁ 和 α₂β₂）的關係是 C₂。注意在 T→R 轉換過程中，α₁β₂ / α₂β₁ 界面旋轉約15°，C₂ 對稱性得以保持。"},

{ch:"7",num:"7-76",
q:"Which of the statements about hemoglobin's oxygen binding is INCORRECT?",
opts:["The hemoglobin tetramer can bind 4 O₂ molecules and the fourth O₂ binds with 4-fold greater affinity than the first (INCORRECT — should be 100-fold)","In any binding system, a sigmoidal curve indicates cooperative interaction between binding sites","The binding of oxygen to hemoglobin is an example of positive cooperativity","Hemoglobin's sigmoidal O₂ binding curve results from the switch between T-state and R-state hyperbolic curves","Oxygen binding causes a change in quaternary structure from T (low affinity) to R (high affinity) state"],
ans:0,
expl:"錯誤的陳述是「第四個 O₂ 結合親和力比第一個高4倍」。根據 Hill plot 分析，hemoglobin 因 positive cooperativity（正協同性），第四個 O₂ 結合親和力比第一個高約 100 倍（而非4倍）。這個驚人的100倍差異正是 sigmoidal 曲線如此陡峭的原因，使 hemoglobin 能在肺（高 pO₂）幾乎完全裝載，在組織（低 pO₂）大量卸載，成為非常高效的 O₂ 運輸工具。"},
