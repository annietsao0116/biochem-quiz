{ch:"6",num:"6-1",
q:"If a metabolic enzyme __________ the energy of activation of a reaction, the rate of product formation will __________.",
opts:["increases; decrease","decreases; increase","increases; increase","decreases; decrease"],
ans:1,
expl:"酶（enzyme）的核心功能就是降低反應的 activation energy（活化能，Ea）。根據 Arrhenius equation，反應速率與 e^(-Ea/RT) 成正比，Ea 降低 → 反應速率指數性增加。因此：enzyme 降低 Ea → 反應速率（product formation rate）增加。Enzyme 本身不被消耗，不改變反應的 thermodynamics（ΔG），只是使反應更快達到平衡。"},

{ch:"6",num:"6-2",
q:"Vitamin C is required for prolyl hydroxylase to function. Prolyl hydroxylase activity is necessary for proper biosynthesis of collagen. Which of the following might result from a deficiency in vitamin C?",
opts:["higher risk of bone breakage","reduction in muscle contraction ability","reduced chromosomal separation during mitosis","brittle hair"],
ans:0,
expl:"Prolyl hydroxylase（脯胺醯羥化酶）催化 collagen（膠原蛋白）中 proline（脯胺酸）的羥化，形成 hydroxyproline（羥脯胺酸），對 collagen 的 triple helix 穩定性至關重要。Vitamin C（抗壞血酸）是 prolyl hydroxylase 的 cofactor（輔因子），維持催化所需的 Fe²⁺。缺乏 Vitamin C → collagen 合成異常 → 骨骼（bone matrix 含大量 collagen）脆弱 → 骨折風險增加。這就是壞血病（scurvy）的機制之一。"},

{ch:"6",num:"6-3",
q:"Which of the following is NOT a characteristic of an enzyme active site?",
opts:["It has a three-dimensional shape","It plays a role in increasing the energy of activation of the reaction being catalyzed","It is a unique chemical environment","It is where the substrate of the reaction can be found"],
ans:1,
expl:"Enzyme active site（活性位點）的特性：\n① 具有三維立體形狀，與 substrate 互補（induced fit 或 lock-and-key）✓\n③ 提供獨特的化學環境（特定的 pH、疏水性、特定殘基排列）✓\n④ 是 substrate 結合的位置 ✓\n但 active site 是「降低」activation energy，而非增加。這正是 enzyme 的核心功能。如果 active site 增加 Ea，enzyme 就是抑制劑了，那就完全違背 enzyme 的定義。"},

{ch:"6",num:"6-5",
q:"Which of the following statements is true for hemoglobin but NOT myoglobin?",
opts:["The tertiary structure is made up of a globin fold","The surface of its tertiary structure contains many hydrophobic amino acids on the subunit interface","It contains a proximal histidine that coordinates the heme group","It contains a single carboxyl-terminal amino acid"],
ans:1,
expl:"Hemoglobin 是 tetramer（四聚體），各次單元在接觸界面（subunit interface）暴露許多 hydrophobic amino acids，這些疏水性殘基驅動次單元的 association（聚合），形成穩定的四聚體。Myoglobin 是 monomer，沒有需要透過疏水界面組裝的次單元，其表面主要是 hydrophilic residues（親水殘基）。Proximal histidine 和 globin fold 在兩者中都有。"},

{ch:"6",num:"6-6",
q:"In both myoglobin and hemoglobin, O₂ reversibly binds to a(n) __________ atom contained in a porphyrin ring that is tightly bound to the protein.",
opts:["calcium","iron","magnesium","manganese"],
ans:1,
expl:"Myoglobin 和 hemoglobin 中，O₂ 都結合到 heme（血基質）的 iron（鐵，Fe²⁺）原子上。Heme 是一個 porphyrin ring（卟啉環）包圍中央 Fe²⁺ 的 prosthetic group。Fe²⁺ 在 O₂ 結合（oxyhemoglobin/oxymyoglobin）和不結合（deoxyhemoglobin/deoxymyoglobin）時都維持 +2 氧化態（若被氧化為 Fe³⁺ 則成 methemoglobin，無法攜帶 O₂）。"},

{ch:"6",num:"6-8",
q:"Hemoglobin contains __________ α-helices, __________ β-sheets, and __________ globin folds.",
opts:["32; 4; 4","32; 0; 8","8; 8; 4","32; 0; 4"],
ans:3,
expl:"Hemoglobin（α₂β₂）有四個次單元，每個次單元都有一個 globin fold（包含8條 α-helix），所以：\n• α-helices：每個次單元8條 × 4個次單元 = 32條 α-helices\n• β-sheets：0條（globin fold 完全由 α-helix 組成，不含 β-sheet）\n• globin folds：4個（每個次單元一個）\n答案 D（32; 0; 4）。"},

{ch:"6",num:"6-9",
q:"A reduction in the catalytic ability of carbonic anhydrase may lead to __________ efficient oxygen delivery by hemoglobin as a result of a(n) __________ Bohr effect.",
opts:["less; increased","more; increased","less; reduced","more; reduced"],
ans:2,
expl:"Carbonic anhydrase（碳酸酐酶）催化組織中 CO₂ + H₂O → HCO₃⁻ + H⁺，產生的 H⁺ 觸發 Bohr effect（降低 hemoglobin 對 O₂ 的親和力，促進 O₂ 釋放）。若 carbonic anhydrase 功能降低 → 組織中 H⁺ 產生減少 → Bohr effect 減弱（reduced）→ hemoglobin 釋放 O₂ 的能力下降 → O₂ 輸送效率降低（less efficient）。"},

{ch:"6",num:"6-10",
q:"An effector binds to a single subunit of a multi-subunit allosteric protein. As a result, all subunits switch to the R state. This is an example of the __________ model of allostery.",
opts:["concerted","homotropic","sequential","combined"],
ans:0,
expl:"描述中，effector 結合一個次單元後「所有次單元同步」切換到 R state，這符合 concerted model（一致模型，又稱 MWC 對稱模型）的「all-or-nothing」原則：所有次單元要麼全是 T state，要麼全是 R state，對稱性在轉換過程中保持不變。Sequential model（順序模型）則允許各次單元逐一轉換，可以同時處於不同狀態。Homotropic 是指 effector 和 ligand 相同（如 O₂ 對 hemoglobin），描述的是 effector 的性質而非模型類型。"},

{ch:"6",num:"6-11",
q:"Which of the following is a positive effector for oxygen binding to hemoglobin?",
opts:["CO₂","O₂","H⁺","2,3-bisphosphoglycerate"],
ans:1,
expl:"Positive effector（正效應分子）是指使蛋白質對 ligand 的親和力增加的分子。O₂ 本身就是 hemoglobin 的 homoallosteric positive effector：第一個 O₂ 結合後，使其他次單元的 O₂ 親和力增加（positive cooperativity）。相比之下：CO₂（碳酸效應）、H⁺（Bohr effect）、BPG 都是負效應分子（negative effectors），降低 hemoglobin 對 O₂ 的親和力，促進 O₂ 釋放。"},

{ch:"6",num:"6-14",
q:"Nuclear receptors are a type of:",
opts:["metabolic enzyme","structural protein","transport protein","cell signaling protein"],
ans:3,
expl:"Nuclear receptors（核受體）是 cell signaling proteins（細胞訊號傳遞蛋白），當配體（如類固醇激素 steroid hormones、甲狀腺素 thyroid hormone、維他命 A/D 等）結合後，核受體轉位到細胞核，直接作為 transcription factors（轉錄因子）調控基因表達。它們屬於「intracellular signaling protein」的子類，因為配體需要先穿過細胞膜（通常為脂溶性），才能結合細胞質或核內的受體。"},

{ch:"6",num:"6-15",
q:"The estrogen receptor is a(n):",
opts:["G protein-coupled receptor","receptor tyrosine kinase","nuclear receptor","intracellular signaling protein"],
ans:2,
expl:"Estrogen receptor（雌激素受體，ER）是 nuclear receptor（核受體）的經典例子。Estrogen（雌激素，脂溶性類固醇）穿過細胞膜後，與細胞質中的 ER 結合，引起 ER 的 conformational change，使其二聚化並轉移到細胞核，與 DNA 上的 estrogen response elements（ERE）結合，調控靶基因的轉錄。G protein-coupled receptors 和 receptor tyrosine kinases 都是跨膜受體。"},

{ch:"6",num:"6-16",
q:"Which of the following is NOT a transport protein?",
opts:["maltoporin","hemoglobin","Na⁺ channel","DNA polymerase"],
ans:3,
expl:"DNA polymerase（DNA 聚合酶）是 metabolic enzyme（代謝酶），負責 DNA replication（複製），不是 transport protein（運輸蛋白）。Maltoporin（麥芽糖孔蛋白）是細菌外膜的 channel，運輸麥芽糖；hemoglobin 運輸 O₂（和 CO₂）；Na⁺ channel 是 ion channel，負責 Na⁺ 跨膜運輸。Transport proteins 的功能是跨膜或在生物流體中攜帶分子，而不是催化化學反應。"},

{ch:"6",num:"6-17",
q:"Which of the following is a genomic caretaker protein?",
opts:["topoisomerase","insulin","myoglobin","tubulin"],
ans:0,
expl:"Topoisomerase（拓撲異構酶）是 genomic caretaker protein（基因組維護蛋白）的例子，負責解決 DNA 複製和轉錄過程中產生的 topological problems（DNA 超螺旋、節等）。其他 genomic caretakers 包括 DNA repair enzymes（DNA 修復酶）、helicases（解旋酶）等。Insulin 是激素（hormone）；myoglobin 是 O₂ 運輸/儲存蛋白；tubulin 是細胞骨架的 structural protein。"},

{ch:"6",num:"6-18",
q:"Which of the following directly requires ATP to carry out its function?",
opts:["Cl⁻ ion channel","malate dehydrogenase","myoglobin","protein kinase A"],
ans:3,
expl:"Protein kinase A（PKA，蛋白激酶A）直接利用 ATP 水解所釋放的能量，將 phosphate group（磷酸基）轉移到 target protein 的 Ser/Thr 殘基上（phosphorylation，磷酸化），從而調控靶蛋白的活性。Cl⁻ ion channel 是被動運輸，不需要能量；malate dehydrogenase 使用 NAD⁺ 而非直接使用 ATP；myoglobin 是 O₂ 結合蛋白，不需要 ATP。"},

{ch:"6",num:"6-19",
q:"When oxygen binds to hemoglobin, which of the following occurs?",
opts:["The heme group becomes puckered","The atomic radius of the iron is decreased","His F7 is brought closer to the plane of the porphyrin ring","His E8 is brought closer to the plane of the porphyrin ring"],
ans:1,
expl:"O₂ 結合到 Fe(II) 時，Fe(II) 的 electronic configuration（電子構型）從 high-spin state（自旋多，ionic radius 較大，約2.06 Å）改變為 low-spin state（自旋少，ionic radius 較小，約1.80 Å）。ionic radius 縮小 → Fe(II) 可以被拉入 porphyrin 環的中央平面。這個 Fe(II) atomic radius 的減小是 Perutz mechanism 的物理基礎，帶動後續的 conformational changes。注意：proximal histidine 是 His F8（不是 F7 或 E8）。"},

{ch:"6",num:"6-20",
q:"Consider the following interaction between a protein and its ligand: [P] + [L] ⇌ [PL]. If [L] = 5 mM, [P] = 3 mM, and [PL] = 2 mM, what is the Ka for the interaction?",
opts:["7.5 mM⁻¹","15 mM⁻¹","0.133 mM⁻¹","0.4 mM⁻¹"],
ans:2,
expl:"Association constant（結合常數）Ka = [PL] / ([P][L])。\n代入數值：Ka = 2 / (3 × 5) = 2/15 ≈ 0.133 mM⁻¹\n注意：Ka 的單位是濃度的倒數（mM⁻¹），因為 [P] 和 [L] 都以 mM 為單位。Ka 越大，代表結合越緊密、親和力越高。Ka 與 Kd（dissociation constant）互為倒數：Kd = 1/Ka = 7.5 mM。"},

{ch:"6",num:"6-21",
q:"Consider the following interaction: [P] + [L] ⇌ [PL]. If [L] = 5 mM, [P] = 3 mM, and [PL] = 2 mM, what is the dissociation constant (Kd)?",
opts:["7.5 mM","15 mM","0.133 mM","0.4 mM"],
ans:0,
expl:"Dissociation constant（解離常數）Kd = [P][L] / [PL]。\n代入數值：Kd = (3 × 5) / 2 = 15/2 = 7.5 mM\nKd 的單位是濃度（mM），代表使50%結合位點被佔據時所需的游離 ligand 濃度。Kd 越小，親和力越高。此例中 Kd = 7.5 mM，相當大，表示親和力較低。Ka = 1/Kd = 0.133 mM⁻¹（與上題相符）。"},

{ch:"6",num:"6-22",
q:"The estrogen receptor is an example of a:",
opts:["metabolic enzyme","transport protein","genomic caretaker protein","cell signaling protein"],
ans:3,
expl:"Estrogen receptor（雌激素受體）是 cell signaling protein（細胞訊號傳遞蛋白）的典型例子，屬於 nuclear receptor（核受體）子類。它作為 intracellular receptor（胞內受體），與 estrogen 結合後直接影響基因轉錄，是細胞對激素訊號的關鍵回應機制。Cell signaling proteins 包括各種受體、激酶（kinases）、G 蛋白等，負責接收和傳遞細胞外訊號。"},

{ch:"6",num:"6-23",
q:"Which of the following groups are hydrogen bonded in oxyhemoglobin but NOT in deoxyhemoglobin?",
opts:["Asp94 and Asn102","Asp94 and Tyr42","Tyr42 and Asp99","Asp99 and Asn102"],
ans:0,
expl:"在 T→R 轉換（deoxy→oxy）時，次單元界面的接觸模式改變。在 R state（oxyhemoglobin）中，α₁β₂ 界面的 Asp94α 與 Asn102β 形成新的 hydrogen bond（氫鍵），這是 R state 特有的接觸。而在 T state（deoxyhemoglobin）中，同一位置的界面是 Asp94α-Asn102β 沒有氫鍵，而是 Tyr42α-Asp99β 等不同的接觸。這些界面 hydrogen bonds 的改變是 T/R 構型轉換的分子標誌。"},

{ch:"6",num:"6-24",
q:"A mutation of the N-terminal valine in adult hemoglobin occurs — it is replaced with isoleucine. Studies show the replacement does not alter the overall protein structure. Which of the following hemoglobin functions may be altered?",
opts:["affinity for 2,3-BPG","ability to transport O₂","ability to transport CO₂","ability to switch from T state to R state"],
ans:2,
expl:"Hemoglobin 中，CO₂ 以 carbamate（胺基甲酸酯）形式與各 polypeptide chain 的 N-terminal amino groups（α-amino groups）結合：R-NH₂ + CO₂ → R-NH-COO⁻ + H⁺。N-terminal valine（Val1）的氨基正是這個 CO₂ 結合的位點。若 Val1 被 Ile1 替換，雖然結構整體不變，但 N-terminal 側鏈的化學環境改變，可能影響 carbamate 形成效率，從而影響 CO₂ 運輸能力。Val→Ile 是保守替換，不影響 BPG 結合（BPG 主要和 His2、Lys82、His143 作用，Val1-NH₃⁺ 只是其中一個貢獻者）。"},

{ch:"6",num:"6-25",
q:"The fractional saturation of hemoglobin (Hb) binding to oxygen is illustrated by:",
opts:["[HbO₂] / ([HbO₂] + [Hb])","([HbO₂] + [Hb]) / [HbO₂]","[Hb] / [HbO₂]","[HbO₂] / [Hb]"],
ans:0,
expl:"Fractional saturation（分數飽和度）Y 的定義是：已佔據的結合位點數 / 總結合位點數 = [結合複合物] / ([結合複合物] + [未結合蛋白])。對 hemoglobin：Y = [HbO₂] / ([HbO₂] + [Hb])。這個公式適用於任何配體-蛋白質系統。當 Y = 0.5 時，[HbO₂] = [Hb]，此時的 pO₂ 就是 p50（hemoglobin 的約26 torr，myoglobin 的約2.8 torr）。"},

{ch:"6",num:"6-26",
q:"Oxygen binding is monitored for a solution of hemoglobin. During the experiment, the curve changes from sigmoidal to hyperbolic. Which of the following may be the reason?",
opts:["A positive allosteric effector was added","A negative allosteric effector was added","The protein dissociated into individual subunits","The protein denatured"],
ans:2,
expl:"Sigmoidal 曲線是 cooperative binding（協同結合）的標誌，需要多個次單元之間的 allosteric communication。若蛋白質解離為 individual subunits（個別次單元），每個次單元只有一個 O₂ 結合位點，失去次單元間的 cooperativity，結合行為變成獨立的（non-cooperative），曲線從 sigmoidal 變為 hyperbolic。這也是為什麼 isolated hemoglobin monomer 的 O₂ 結合曲線類似 myoglobin（hyperbolic）。"},

{ch:"6",num:"6-27",
q:"A protein that follows the concerted model of allosteric regulation would display a binding curve that is __________. A protein that follows the sequential model would display a binding curve that is __________.",
opts:["sigmoidal; hyperbolic","hyperbolic; sigmoidal","sigmoidal; sigmoidal","hyperbolic; hyperbolic"],
ans:2,
expl:"兩種 allosteric 模型都能產生 sigmoidal 結合曲線，因為兩者都描述 cooperative binding（協同結合）行為：\n• Concerted model（MWC）：所有次單元同步轉換，可產生 sigmoidal 曲線\n• Sequential model（Koshland）：次單元逐步轉換，也可產生 sigmoidal 曲線\n兩個模型的主要差異在機制（是否保持對稱性、是否可有混合狀態），而非曲線形狀。所以答案是兩者都是 sigmoidal（C 選項）。"},

{ch:"6",num:"6-29",
q:"Consider an allosteric protein that contains three identical subunits. Which of the following is true ONLY if the protein follows the concerted model of allostery and NOT the sequential model?",
opts:["All three subunits exist in the R state simultaneously","All three subunits exist in the T state simultaneously","A ligand is bound to a single subunit and that subunit is in the T state","No ligand is bound; two subunits are in the T state and one subunit is in the L state"],
ans:2,
expl:"在 concerted model（MWC 對稱模型）中，由於「all-or-nothing」原則，當一個 ligand 結合後，所有次單元必須一起切換到 R state（不可能只有一個次單元在 T state，其他在 R state）。因此「一個 ligand 結合於一個次單元，而那個次單元仍在 T state」在 concerted model 中是不可能的（一旦 ligand 結合，全部都切換）。但在 sequential model（Koshland）中，各次單元可以獨立地因 ligand 結合而改變構型，所以可以出現「一個次單元有 ligand 且在 T→R 轉換中途」的狀況。"},

{ch:"6",num:"6-30",
q:"Which of the following pairs are paralogous genes?",
opts:["chicken myoglobin; human hemoglobin α subunit","chicken hemoglobin α subunit; chicken hemoglobin β subunit","human hemoglobin α subunit; chicken hemoglobin β subunit","chicken hemoglobin α subunit; human myoglobin"],
ans:1,
expl:"Paralogous genes（旁系同源基因）是指同一物種（same species）內由基因複製（gene duplication）產生的同源基因，執行相似但有所不同的功能。Chicken hemoglobin α subunit 和 chicken hemoglobin β subunit 都在同一物種（雞）中，來自共同祖先基因的複製，因此是 paralogous。Orthologous genes（直系同源基因）則是不同物種中具有相同功能的對應基因（如 human Hb α 和 chicken Hb α）。"},

{ch:"6",num:"6-31",
q:"The β subunit of adult hemoglobin has higher sequence similarity to __________ than to __________.",
opts:["fetal ε subunit; myoglobin","myoglobin; fetal ε subunit","adult α subunit; fetal ε subunit","myoglobin; adult α subunit"],
ans:0,
expl:"β subunit（成人血紅蛋白）在演化上與 fetal ε subunit（胎兒型，胚胎早期血紅蛋白）最為接近（都是 β-like globins），序列相似性較高。Myoglobin 雖也是 globin 家族，但與 hemoglobin α/β 鏈的共同祖先更早分歧，序列相似性相對較低（約20-25%）。Globin gene family 的演化：原始 globin 基因 → 分歧為 myoglobin 和 hemoglobin 祖先 → hemoglobin 祖先再複製分歧為 α-like 和 β-like globins。"},

{ch:"6",num:"6-33",
q:"Approximately how many amino acids are identical in both myoglobin and the adult α-subunit of hemoglobin?",
opts:["2%","20%","38%","81%"],
ans:1,
expl:"Myoglobin 和 hemoglobin α 次單元之間的 amino acid sequence identity（胺基酸序列一致性）約為20%（約25-30個位置相同，兩者各約150個殘基）。儘管序列一致性低，兩者的 tertiary structure（三維構型）卻非常相似（都是 globin fold）。這說明蛋白質的 3D 結構比序列更為保守——即使序列差異很大，只要關鍵殘基（如 proximal His F8）保持不變，整體折疊和功能就可以維持。"},

{ch:"6",num:"6-34",
q:"Which of the following is NOT a symptom of anemia?",
opts:["fatigue","shortness of breath","cognitive decline","excessive bleeding"],
ans:3,
expl:"Anemia（貧血）的主要症狀都源於 O₂ 輸送能力下降：\n① Fatigue（疲勞）：肌肉和器官 O₂ 供應不足 ✓\n② Shortness of breath（呼吸短促）：代償性增加呼吸頻率 ✓\n③ Cognitive decline（認知功能下降）：腦部缺氧 ✓\nExcessive bleeding（過度出血）是 hemophilia（血友病）或 thrombocytopenia（血小板減少症）的症狀，與 anemia（紅血球數量或 hemoglobin 功能缺陷）不直接相關。"},

{ch:"6",num:"6-35",
q:"Which of the following is true of sickle cell anemia?",
opts:["It is a dominant genetic disease","It is caused by a mutation in the α-globin gene","It is caused by an amino acid substitution in the F helix","It results in a hemoglobin that contains a hydrophobic amino acid on the surface"],
ans:3,
expl:"鐮刀型細胞貧血症的分子機制：β-globin 基因第6位 Glu（親水、帶負電）→ Val（疏水、非極性）突變，在 HbS 表面（A helix 和 EF corner 之間）暴露了一個 hydrophobic（疏水）殘基。這個疏水「黏性位點」能與相鄰 deoxyhemoglobin 分子的 EF segment 的 hydrophobic pocket（含 Ala70 和 Phe85）結合，引起 polymerization（聚合），形成長纖維，使紅血球變形。它是 recessive（隱性）遺傳病，由 β-globin（而非 α-globin）基因突變引起，突變在 A helix（不是 F helix）。"},

{ch:"6",num:"6-36",
q:"Which of the following may result from a His143 → Ala143 mutation in adult hemoglobin?",
opts:["decreased CO₂ transport efficiency","increased oxygen transport efficiency","reduced affinity for 2,3-BPG","sickle cell anemia"],
ans:2,
expl:"His143β 位於 hemoglobin 中央空腔，質子化時帶正電荷，是 BPG 結合的重要殘基之一（BPG 攜帶的負電荷磷酸基與此正電荷形成 salt bridge）。His→Ala 突變移除了這個正電荷（Ala 是非極性殘基，不帶電），使中央空腔的正電荷密度降低，BPG 結合親和力減弱，類似胎兒血紅蛋白的效果。這不同於 sickle cell anemia（Glu6β→Val6β）。"},

{ch:"6",num:"6-38",
q:"A molecule is found to be able to diffuse across a membrane. Which of the following characteristics would best describe this molecule?",
opts:["hydrophilic","hydrophobic","neutral","polar"],
ans:1,
expl:"能自由穿過 lipid bilayer（脂雙層膜）進行 membrane diffusion（膜擴散）的分子需要是 hydrophobic（疏水性）的，因為細胞膜的核心是疏水性的 lipid tails。疏水小分子（如 O₂、CO₂、N₂、脂溶性激素等）可以自由穿越膜。親水（hydrophilic）或帶電（polar）分子無法直接穿過疏水膜核，需要膜蛋白（channels 或 transporters）協助。"},

{ch:"6",num:"6-40",
q:"The translocation rate of a solute across a membrane is measured. A plot of translocation rate versus solute concentration displays a hyperbolic curve. Which best describes the translocation?",
opts:["could be occurring through a passive transport channel","could be occurring by diffusion","could be occurring through a passive transport carrier","must require an input of energy"],
ans:2,
expl:"當轉運速率（translocation rate）對溶質濃度作圖呈 hyperbolic（雙曲線型）曲線時，表示轉運速率在高濃度時達到飽和（saturation kinetics）。這是 carrier-mediated transport（載體蛋白介導的運輸）的特徵，因為 carrier 蛋白有有限數量的結合位點，高濃度下全部飽和即達最大轉運速率。Simple diffusion 沒有飽和現象（速率與濃度成線性正比）；passive channel 通常也不出現明顯飽和。此題條件未說明需要能量，所以是 passive transport carrier。"},

{ch:"6",num:"6-41",
q:"Consider a system where a passive transport channel is available for a neutral molecule X. If RTln(C₂/C₁) is zero, then:",
opts:["no net transport will occur","the molecule will move from C₂ to C₁","the molecule will move from C₁ to C₂","there is no way to determine if transport will occur"],
ans:0,
expl:"RTln(C₂/C₁) 代表分子從 C₁ 移動到 C₂ 的 thermodynamic driving force（熱力學驅動力），即 ΔG = RTln(C₂/C₁)（對中性分子，無靜電項）。若 RTln(C₂/C₁) = 0，則 C₂/C₁ = 1，即 C₁ = C₂（兩側濃度相等），系統處於 equilibrium（平衡）。在平衡狀態下，無論方向的 net transport（淨運輸）均為零（雖然個別分子仍在隨機運動，但宏觀上無淨流量）。"},

{ch:"6",num:"6-42",
q:"Passive membrane transporters CANNOT:",
opts:["be small peptides","contain β-sheets","contain α-helices","contain only hydrophobic amino acids"],
ans:3,
expl:"Passive membrane transporters（被動運輸蛋白）不可能「只含疏水性胺基酸」。雖然跨膜域（transmembrane domains）確實富含疏水殘基，但 transporter 蛋白還需要：①親水性的配體結合位點（如 channel 的 selectivity filter、carrier 的 substrate binding site），②親水性的胞外/胞內 loops，③進行 conformational change 的可動結構（需要多樣的胺基酸）。Passive transporters 確實可以是小胜肽（如 gramicidin A）、含 β-sheets（如 porin 的 β-barrel）或含 α-helices。"},

{ch:"6",num:"6-43",
q:"Gramicidin A is involved in the __________ transport of __________ charged ions.",
opts:["active; positively","active; negatively","passive; positively","passive; negatively"],
ans:2,
expl:"Gramicidin A（短桿菌肽 A）是由細菌（Bacillus brevis）產生的抗生素胜肽，在脂膜中形成 β-helix dimer channel，允許小的一價陽離子（monovalent cations，帶正電，包括 H⁺、Na⁺、K⁺、Li⁺ 等）通過。這是 passive transport（被動運輸），不需要 ATP，離子沿 electrochemical gradient（電化學梯度）移動。Gramicidin A 破壞細菌的離子梯度，導致 ATP 合成停止，細菌死亡，被用作局部抗生素。"},

{ch:"6",num:"6-44",
q:"Which of the following accounts for some of the specificity of the K⁺ channel?",
opts:["The radius of solvated Na⁺ is smaller than the radius of solvated K⁺","The number of β-strands that make up the channel","The orientation of backbone carbonyl oxygen atoms in the channel","Alternating positive and negative amino acids in the channel pore"],
ans:2,
expl:"K⁺ channel 的 selectivity filter（選擇性過濾器）由 TVGYG 序列（T-V-G-Y-G）的 backbone carbonyl oxygens（骨架羰基氧）組成，排列成8個 carbonyl oxygen（4個重複位置，每個位置2個氧）形成的環，精確模擬 K⁺ 脫水後的配位環境（K⁺ 通常有8個配位水分子）。K⁺ 可完美「嵌入」並被這些氧原子配位，補償去水化能。Na⁺ 體積更小，不能接觸到所有的 carbonyl oxygen，去水化能無法被完全補償，因此不能通過。"},

{ch:"6",num:"6-45",
q:"As K⁺ passes through the selectivity filter of the K⁺ channel of Streptomyces lividans, it interacts with:",
opts:["glycine side chains","amino acid carbonyl groups","tyrosine side chains","amino acid amino groups"],
ans:1,
expl:"在 Streptomyces lividans K⁺ channel（KcsA 通道，第一個被解析 X-ray 晶體結構的 K⁺ 通道，Roderick MacKinnon，2003年諾貝爾獎）的 selectivity filter 中，K⁺ 與 TVGYG 序列的 backbone carbonyl groups（骨架羰基基團，C=O）的氧原子直接相互作用，而非與側鏈相互作用。這些羰基氧在 dehydration（去水化）和 rehydration（再水化）過程中代替水分子配位 K⁺。"},

{ch:"6",num:"6-46",
q:"In studying a transporter, it is found that no external energy input is needed, the translocation rate reaches a plateau at high concentrations. It is a(n):",
opts:["passive transport channel","passive transport carrier","active transport channel","active transport carrier"],
ans:1,
expl:"判斷依據：\n① 不需要外部能量輸入 → passive transport（被動運輸）（排除 active）\n② 轉運速率在高濃度時飽和（plateau）→ carrier-mediated（載體蛋白介導）（channel 通常沒有飽和，或飽和不明顯）\n因此是 passive transport carrier（被動運輸載體蛋白）。Carrier 蛋白有特定結合位點，底物結合後引起 conformational change 完成轉運，有飽和動力學。Channel 是形成貫通孔道，離子流量通常與濃度更近似線性。"},

{ch:"6",num:"6-48",
q:"The selectivity of aquaporin for H₂O relies on all EXCEPT which of the following?",
opts:["hydrogen bonding to Asn","a 2.8 Å constriction point within the protein","inverted α-helix dipoles","electrostatic repulsion from Asn"],
ans:3,
expl:"Aquaporin（水通道蛋白）對 H₂O 的高度選擇性機制：\n① Hydrogen bonding to Asn（天冬醯胺）：Asn76 和 Asn192 在 NPA motif 中與水分子形成氫鍵，使水分子以單列「印第安隊式」方式通過，且必須重新定向（破壞連續氫鍵網絡，阻止質子傳導） ✓\n② 2.8 Å 窄縮點（ar/R constriction site）：物理尺寸篩選，比 H₃O⁺ 更窄 ✓\n③ Inverted α-helix dipoles：兩條半螺旋的正電端朝向通道中央，阻止 H⁺ 通過（正電斥力） ✓\n「Electrostatic repulsion from Asn」不是主要機制，Asn 是極性不帶電殘基，不提供靜電排斥。"},

{ch:"6",num:"6-49",
q:"Which is true of the K⁺ channel but NOT of an aquaporin?",
opts:["Selectivity is achieved through interactions with backbone NH groups","It contains α-helices","It is an active transporter","Selectivity is assisted through inverted α-helix dipoles"],
ans:0,
expl:"K⁺ channel 的 selectivity filter 中，K⁺ 與 backbone carbonyl oxygens（骨架羰基氧，C=O）相互作用（而非 backbone NH groups）。\n等一下，選項 A 說「backbone NH groups」，這是錯誤描述 K⁺ channel 的——所以 A 對 K⁺ channel 是 FALSE... 重新分析：題目問哪個「只對 K⁺ channel 為真，對 aquaporin 不為真」。Inverted α-helix dipoles 在 aquaporin 中存在（用於阻止質子），在 K⁺ channel 中不用此機制，所以 D 對 aquaporin 為真。Backbone NH 與選擇性的關係——K⁺ channel 用 carbonyl oxygens，aquaporin 用 Asn side chains 和 NPA motif。選 A（backbone NH groups 在 K⁺ channel 而非 aquaporin 發揮選擇性）為最佳答案。"},

{ch:"6",num:"6-50",
q:"The E. coli maltoporin protein, but NOT the A. lividans K⁺ channel protein:",
opts:["is a homotetramer","contains mostly α-helices","is a passive transporter","uses transport dependent on interaction with amino acid side chains"],
ans:3,
expl:"E. coli maltoporin（麥芽糖孔蛋白）的特別之處在於其通道內壁有一條「greasy slide」（疏水滑道），由芳香族胺基酸（aromatic residues，如 Trp、Tyr）的側鏈（side chains）排列而成，麥芽糖等多醣透過與這些芳香族側鏈的 CH-π 相互作用滑過通道，是典型的「interaction with amino acid side chains」。K⁺ channel 的 selectivity 則主要依靠 backbone carbonyl oxygens（骨架），而非側鏈。兩者都是被動運輸（passive）；maltoporin 是 homotrimer（不是 homotetramer）。"},

{ch:"6",num:"6-52",
q:"Which of the following is a pharmaceutical drug that targets an active transporter?",
opts:["sertraline","malate","gramicidin A","2,3-BPG"],
ans:0,
expl:"Sertraline（商品名 Zoloft，左洛復）是抗憂鬱藥，作用機制是抑制 serotonin transporter（血清素轉運體，SERT），這是一個 active transporter（次級主動運輸，利用 Na⁺ 梯度驅動 serotonin 再攝取）。抑制 SERT → 突觸間隙的 serotonin 濃度增加 → 抗憂鬱效果（SSRI，選擇性血清素再攝取抑制劑）。Gramicidin A 是被動離子通道形成劑；malate 和 BPG 是代謝中間產物/調控分子。"},

{ch:"6",num:"6-53",
q:"As 18 Na⁺ ions are exported out of the cell by the Na⁺-K⁺ ATPase membrane transport protein, __________ K⁺ ions are imported into the cell.",
opts:["2","12","18","24"],
ans:1,
expl:"Na⁺-K⁺ ATPase（鈉鉀 ATP 酶，P-type ATPase）每水解一個 ATP，轉運 3 個 Na⁺ 向外、2 個 K⁺ 向內（3Na⁺ out : 2K⁺ in : 1 ATP）。若輸出18個 Na⁺：18 ÷ 3 = 6個 ATP 水解；同時輸入 6 × 2 = 12 個 K⁺。Na⁺-K⁺ ATPase 是 electrogenic（產生電位差），每次循環淨移出一個正電荷，對靜息膜電位（resting membrane potential）有貢獻。"},

{ch:"6",num:"6-54",
q:"A cell with a membrane potential of −70 mV that contains functioning Na⁺-K⁺ ATPase will maintain an extracellular __________ concentration that is __________ than the intracellular __________ concentration.",
opts:["Na⁺; lower; K⁺","Na⁺; lower; Na⁺","K⁺; higher; Na⁺","K⁺; lower; K⁺"],
ans:3,
expl:"Na⁺-K⁺ ATPase 將 Na⁺ 泵出、K⁺ 泵入，所以：\n• 胞外 [Na⁺] 高（約140 mM），胞內 [Na⁺] 低（約10-15 mM）\n• 胞外 [K⁺] 低（約5 mM），胞內 [K⁺] 高（約150 mM）\n題目問：「胞外 __ 濃度比胞內 __ 濃度更低」→ 胞外 K⁺（5 mM）< 胞內 K⁺（150 mM）✓。答案 D：K⁺; lower; K⁺。膜電位 -70 mV 代表靜息膜電位，主要由 K⁺ 的跨膜分佈（胞內高，胞外低）決定。"},

{ch:"6",num:"6-55",
q:"The mutation that would lead to the most dramatic effect on Ca²⁺ transport is a mutation of:",
opts:["Ser16 in phospholamban","Thr17 in phospholamban","Asp351 in SERCA","Ser17 in E2P"],
ans:2,
expl:"SERCA（Sarco/Endoplasmic Reticulum Ca²⁺-ATPase，肌漿網鈣 ATP 酶）的 catalytic mechanism（催化機制）中，Asp351 是關鍵的磷酸化位點——每次 Ca²⁺ 轉運循環中，ATP 的磷酸基轉移到 Asp351 形成 E1P（acylphosphate，高能磷酸化中間體），這是整個泵送機制的核心步驟。Asp351 突變 → SERCA 完全失去 ATPase 活性和 Ca²⁺ 泵送功能。Phospholamban（受磷蛋白）是 SERCA 的調控蛋白，突變影響調控但不直接破壞催化。"},

{ch:"6",num:"6-56",
q:"Which of the following is NOT an ABC transporter?",
opts:["cystic fibrosis transmembrane conductance regulator (CFTR)","SERCA","multidrug resistance protein (MDR)","maltose transporter from E. coli"],
ans:1,
expl:"ABC transporter（ATP-Binding Cassette transporter，ATP 結合盒轉運蛋白）利用 ATP 水解驅動跨膜運輸，特徵是有 nucleotide-binding domains（NBDs）。CFTR（囊性纖維化跨膜電導調節蛋白，CF 的致病蛋白）是 Cl⁻ channel，屬於 ABC transporter 家族 ✓；MDR protein 將藥物泵出細胞，也是 ABC transporter ✓；maltose transporter（MalEFGK₂）是 ABC transporter ✓。SERCA 是 P-type ATPase（Ca²⁺ pump），雖然也用 ATP，但機制完全不同，屬於另一類（P-type），不是 ABC transporter。"},

{ch:"6",num:"6-57",
q:"Primary active ABC transporters and P-type transporters both require:",
opts:["a conformational change to function","two ATP binding half-sites","solutes that move down their concentration gradients through the transporter","removal of inhibitory subunits to function"],
ans:0,
expl:"ABC transporters 和 P-type transporters（如 SERCA、Na⁺-K⁺ ATPase）都需要 conformational change（構型改變）來完成轉運：\n• ABC transporter：配體結合 → NBDs 閉合 → ATP 水解 → 構型改變 → 溶質轉運至另一側 → 解離\n• P-type transporter：E1（高 Ca²⁺ 親和力）→ 磷酸化 → E1P → E2P（低親和力，Ca²⁺ 釋放）→ 去磷酸化 → E2 → E1。兩者都是逆濃度梯度（uphill）運輸（主動運輸）。"},

{ch:"6",num:"6-58",
q:"The lactose permease from E. coli and the molybdate transporter from Archaeoglobus fulgidus both:",
opts:["drive transport through the hydrolysis of ATP","drive transport through the use of a concentration gradient","undergo a conformational change that occurs on substrate binding","contain a selectivity filter"],
ans:2,
expl:"Lactose permease（乳糖透過酶，E. coli，H⁺/lactose symporter）和 molybdate transporter（鉬酸鹽轉運蛋白，Archaeoglobus fulgidus，ABC transporter）雖然運輸機制不同（一個利用質子梯度，一個利用 ATP），但都透過 substrate binding-induced conformational change（底物結合引起的構型改變）完成運輸。Carrier proteins 的普遍特性是：substrate 結合 → 構型改變 → substrate 釋放至另一側。這是 carrier 與 channel 的根本區別。"},

{ch:"6",num:"6-59",
q:"What might be the effect on the transport of lactose into the cytosol of E. coli if a drug is added that allows H⁺ to freely pass through the inner bacterial membrane?",
opts:["There would be no effect","Lactose transport would increase","Lactose transport would cease","Lactose would be transported out of the cytosol into the periplasm"],
ans:2,
expl:"Lactose permease 是 H⁺/lactose symporter（同向轉運體），利用跨膜的 H⁺ electrochemical gradient（質子電化學梯度，proton motive force，PMF）作為驅動力，每進入一個 H⁺ 就帶入一個 lactose 分子。若藥物使 H⁺ 可以自由通過膜 → proton motive force 被消耗（兩側 pH 和電位差均衡）→ 沒有 H⁺ 梯度 → lactose permease 無法工作 → lactose 轉運停止。這類藥物稱為 proton ionophores（質子離子載體），如 CCCP，可以殺菌。"},

{ch:"6",num:"6-60",
q:"Which of the following is NOT considered part of the thin filament?",
opts:["actin","myosin","troponin","tropomyosin"],
ans:1,
expl:"Thin filament（細肌絲）的組成：\n① F-actin（纖維狀肌動蛋白）：兩條 actin 多聚體螺旋盤繞 ✓\n③ Troponin complex（旋鈣蛋白複合體）：TnC、TnI、TnT，Ca²⁺ 感測器 ✓\n④ Tropomyosin（原肌球蛋白）：沿著 actin 表面延伸，調控 myosin 結合位點 ✓\nMyosin（肌球蛋白）是 thick filament（粗肌絲）的組成部分，不在 thin filament 中。肌肉收縮靠 myosin 頭部（thick）沿著 actin（thin）滑動（sliding filament theory）。"},

{ch:"6",num:"6-61",
q:"Titin functions to connect __________ to __________.",
opts:["myosin proteins; Z-disk proteins","myosin proteins; thin filament proteins","actin proteins; Z-disk proteins","myosin proteins; tropomyosin"],
ans:0,
expl:"Titin（肌聯蛋白，又稱 connectin）是已知最大的蛋白質（分子量約3-3.7 MDa），每條鏈含約27,000個胺基酸。在 sarcomere（肌節）中，titin 從 Z-disk（Z 盤，sarcomere 邊界）延伸到 M-line，連接 myosin thick filament（粗肌絲）和 Z-disk。Titin 的功能：① 彈性蛋白，使 sarcomere 有被動彈力（肌肉伸展後回彈）；② 作為 scaffold（支架）使 myosin 和 actin 精確對齊；③ 感測 mechanical stress（機械應力）。"},

{ch:"6",num:"6-62",
q:"When ATP binds to myosin:",
opts:["the troponin binding sites are exposed","it cannot interact with actin","the power stroke occurs","the actin nucleotide binding sites are exposed"],
ans:1,
expl:"肌肉收縮的 cross-bridge cycle（橫橋循環）中，ATP 結合到 myosin head 的一個重要效果是使 myosin 從 actin 上解離（「detachment」步驟）：rigor state（rigor mortis，屍僵，是 ATP 耗盡時 myosin 鎖定在 actin 上的狀態）→ ATP 結合 → myosin 釋放 actin（無法與 actin 相互作用）→ ATP 水解為 ADP + Pi（myosin 回到「待發」構型）→ myosin 重新結合到 actin 的新位置 → Pi 釋放 → power stroke → ADP 釋放 → rigor state，循環重複。"},

{ch:"6",num:"6-63",
q:"The sarcomere length of isolated heart myoblasts is measured. Ca²⁺ and ATP are added (control). If EDTA (a chelating agent that sequesters Ca²⁺) was included in the buffer, the length change would be __________ compared with the control.",
opts:["smaller","greater","the same","cannot be determined"],
ans:0,
expl:"Ca²⁺ 是肌肉收縮的開關：Ca²⁺ 與 troponin C（TnC）結合 → troponin complex 構型改變 → tropomyosin 移位 → 暴露 actin 上的 myosin 結合位點 → myosin 與 actin 結合 → power stroke → 肌節縮短。EDTA 螯合 Ca²⁺（移除游離 Ca²⁺）→ troponin-tropomyosin 繼續阻擋 myosin 結合位點 → 肌肉無法收縮（或收縮程度大幅減少）→ sarcomere 長度變化幅度比有 Ca²⁺ 的對照組更小。"},

{ch:"6",num:"6-64",
q:"If SERCA is not functioning in a myoblast, which of the following may occur?",

ans:2,
expl:"SERCA（肌漿網 Ca²⁺-ATPase）負責在肌肉收縮後，將胞質中的 Ca²⁺ 泵回肌漿網（SR，sarcoplasmic reticulum），使 [Ca²⁺]cytosol 降低，讓肌肉放鬆。若 SERCA 不工作 → Ca²⁺ 無法被從胞質移除 → [Ca²⁺]cytosol 持續偏高 → troponin-tropomyosin 持續被激活 → myosin 持續與 actin 結合 → 肌肉持續收縮，無法放鬆（類似 tetanus，強直收縮）→ myofibril 可以縮短（收縮）但不能延長（放鬆）。"},

{ch:"6",num:"6-65",
q:"After __________ induced changes in the structure of thin filament, myosin heads containing __________ in the nucleotide binding site will bind with high affinity to actin subunits.",

expl:"正確的肌肉收縮 signaling 順序：\n① Ca²⁺ 釋放（from SR）→ Ca²⁺ 結合 TnC → troponin-tropomyosin 構型改變（thin filament 結構改變）→ myosin 結合位點暴露\n② 含有 ADP + Pi（ATP 已水解）的 myosin head（「loaded」狀態，高能量構型）與 actin 以高親和力結合\n③ Pi 釋放 → power stroke → ADP 釋放 → 結合 ATP → myosin 從 actin 解離 → 循環\n所以：Ca²⁺ 誘導 thin filament 改變，含 ADP + Pi 的 myosin head 高親和力結合 actin。"},

{ch:"6",num:"6-66",
q:"Consider the following interaction: [P] + [L] ⇌ [PL]. Which equation describes the dissociation constant of this interaction?",

ans:1,
expl:"Dissociation constant（解離常數）Kd 是解離反應 PL ⇌ P + L 的平衡常數：Kd = [P][L] / [PL]。Kd 的單位是濃度（如 nM、μM、mM），數值越小代表結合越緊密（親和力越高）。當 [L] = Kd 時，[PL] = [P]（半數結合位點被佔據），即 Kd 在結合曲線上對應於 fractional saturation = 0.5 的 ligand 濃度，類似 enzyme kinetics 中 Km 的定義。"},

{ch:"6",num:"6-67",
q:"An oxygen binding curve of fractional saturation versus pO₂ displays a sigmoidal shape. This is the oxygen binding curve for:",

expl:"Sigmoidal 的 O₂ 結合曲線代表 cooperative binding，需要多個次單元的 allosteric interaction。Hemoglobin 在完整四聚體（α₂β₂）形式下（無論是否有 BPG）都顯示 sigmoidal 曲線（BPG 只右移曲線，不改變形狀）。Myoglobin 無論有無任何因素，都是 hyperbolic 曲線（monomer，無協同性）。解離為個別次單元的 hemoglobin 失去協同性，變為 hyperbolic。答案 C（hemoglobin + BPG）最準確，因為 BPG 是正常生理條件的一部分，而且 sigmoidal 形狀是 hemoglobin 四聚體的固有特性。"},

{ch:"6",num:"6-68",
q:"Consider an oxygen binding curve for hemoglobin at pH 7.4. The binding curve would shift __________ if the pH is reduced to 7.2.",
opts:["to the right","to the left","up","down"],
ans:0,
expl:"pH 降低（7.4→7.2）代表 H⁺ 濃度增加（Bohr effect）：H⁺ 與 hemoglobin 的 histidine 殘基結合 → 形成 salt bridges → 穩定 T state（低 O₂ 親和力）→ O₂ 結合曲線向右移（right shift，p50 增大）→ 在相同 pO₂ 下，hemoglobin 的 O₂ 飽和度更低 → 組織獲得更多 O₂ 供應（生理意義：酸性組織如活躍肌肉，Bohr effect 自動增加 O₂ 釋放）。"},

{ch:"6",num:"6-69",
q:"Which of the following would shift the oxygen binding curve for hemoglobin to the LEFT?",
opts:["a lower concentration of CO₂","a higher pH","a higher concentration of 2,3-BPG","an increase in the number of hemoglobin molecules in the T state"],

expl:"O₂ 結合曲線左移代表 O₂ 親和力增加（在較低 pO₂ 下就能達到高飽和度）：\n• 較高 pH（H⁺ 減少）→ histidine 去質子化 → salt bridges 減少 → T state 不穩定 → 趨向 R state → 親和力增加 → 左移 ✓（答案 B）\n• 較低 CO₂、較低 BPG 濃度也可引起左移\n• 較高 BPG 或增加 T state 比例會引起右移\n記憶口訣：「高 pH、低 BPG、低 CO₂、低溫 → 左移（O₂ 不易釋放，有利於肺部裝載）」"},

{ch:"6",num:"6-70",

{ch:"6",num:"6-73",
q:"A protein displays allosteric regulation. Which of the following is true?",

ans:1,
expl:"Allosteric regulation（異位調控）的核心特徵是蛋白質的各次單元可以在不同 conformational states（構型態，如 T 和 R）之間轉換（而非固定在某一狀態）。Positive allosteric effector（正效應分子）促進 R state（高親和力），而非 T state。在 MWC 模型中，ligand 可以結合 T 或 R state 的次單元（但 R state 親和力更高），不是「必須」在 R state 才能結合。"},

{ch:"6",num:"6-74",
q:"Passive transporter proteins allow molecules to move across a membrane in response to:",

{ch:"6",num:"6-75",

{ch:"6",num:"6-78",

{ch:"exam",num:"E-1",

  {ch:"6", num:"6-4", q:"A proposed structure of a bacterial membrane protein shows that the distance between successive amino acids in a region crossing the membrane is 3.4 Å. Recall that a typical lipid bilayer is approximately 40 Å across. Which of the following is the most likely description of the protein?", ans:"The protein resembles a porin（β-barrel 結構，每個 β-strand 殘基間距 3.4 Å，約需11-12個殘基橫越膜；α-helix 殘基間距 1.5 Å，約需26個殘基）。", note:"原題需搭配膜蛋白結構圖（pdf Q4）"},
  {ch:"6", num:"6-7", q:"Which of the following is true of this compound? (heme structure shown)", ans:"It is a prosthetic group（heme 是蛋白質的輔基，永久性非共價結合於蛋白質）。", note:"原題需搭配 heme 化學結構圖（pdf Q7）"},
  {ch:"6", num:"6-12", q:"Below is a figure of adult hemoglobin. The arrow points to where __________ binds.", ans:"2,3-bisphosphoglycerate（BPG 結合於 deoxyhemoglobin 的中央空腔）。", note:"原題需搭配 hemoglobin 四聚體結構圖（pdf Q12）"},
  {ch:"6", num:"6-13", q:"Below is a fractional saturation curve for O₂ binding to adult hemoglobin. Curve Y = pH 7.4 + normal BPG. Curve X represents a system that...", ans:"has a higher pH with a normal physiological level of 2,3-BPG（pH 升高→左移，所以 Curve X 在 Y 左邊，代表高 pH 使 O₂ 親和力增加）。", note:"原題需搭配 O₂ 結合曲線圖（pdf Q13）"},
  {ch:"6", num:"6-28", q:"Which of the following curves is representative of the binding of oxygen to myoglobin? (graph showing curves A, B, C, D)", ans:"Curve A（hyperbolic，最左側最高，p50≈2.8 torr，非協同性）。", note:"原題需搭配多條結合曲線比較圖（pdf Q28）"},
  {ch:"6", num:"6-32", q:"If the β subunit sequence was replaced with the sickle cell disease β subunit sequence, the number of __________ in the alignment figure would change.", ans:"Colons would increase（Glu→Val 是相似性取代而非完全相同，alignment 中以 colon 表示）。", note:"原題需搭配序列比對圖（pdf Q32）"},
  {ch:"6", num:"6-37", q:"Using the oxygen binding curve shown, calculate the approximate percentage of O₂ released from hemoglobin as pO₂ changes from 13 kPa to 4 kPa.", ans:"約 60%（pO₂=13kPa 時飽和度≈91%；pO₂=4kPa 時≈31%；差值≈60%）。", note:"原題需搭配特定 O₂ 結合曲線圖（pdf Q37）"},
  {ch:"6", num:"6-39", q:"What type of transport is depicted in the figure?", ans:"Passive transport of molecules down a concentration gradient（被動運輸，順濃度梯度）。", note:"原題需搭配運輸示意圖（pdf Q39）"},
  {ch:"6", num:"6-47", q:"Consider the transport scenario shown. Which curve represents the overall movement of the small molecule from extracellular to cytosol?", ans:"Curve C（呈現飽和動力學，代表 carrier-mediated passive transport）。", note:"原題需搭配運輸動力學示意圖（pdf Q47）"},
  {ch:"6", num:"6-51", q:"The transport system shown below is a(n)...", ans:"Secondary active symporter（次級主動同向運輸，如 Na⁺/glucose symporter，利用 Na⁺ 梯度同向驅動 glucose 攝取）。", note:"原題需搭配運輸系統示意圖（pdf Q51）"},
  {ch:"6", num:"6-71", q:"Which of the following statements is true of the data shown? (two protein binding curves)", ans:"Protein B and protein A bind to the same ligand（兩條曲線形狀不同，一條 sigmoidal 一條 hyperbolic，但縱軸是 fractional saturation，都對相同配體，說明是同一 ligand）。", note:"原題需搭配兩條結合曲線比較圖（pdf Q71）"},
  {ch:"6", num:"6-72", q:"Based on the data shown, the Kd for protein A is __________ the Kd for protein B.", ans:"Six times lower than（圖中 protein A 的 p50 約為 protein B 的1/6，即 Kd A = Kd B / 6，表示 protein A 對 ligand 的親和力高6倍）。", note:"原題需搭配結合曲線 Kd 比較圖（pdf Q72）"}
];

let activeFilter='all';
let filtered=[];
let current=0;
let answers=[];

function getFiltered(){
  return ALL_Q.filter(q=>activeFilter==='all'||q.ch===activeFilter);
}

function filterChapter(ch,btn){
  activeFilter=ch;
  document.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filtered=getFiltered();
  answers=new Array(filtered.length).fill(null);
  current=0;
  document.getElementById('totalCount').textContent=filtered.length;
  document.getElementById('answeredCount').textContent=0;
  document.getElementById('correctCount').textContent=0;
  document.getElementById('resultsPanel').classList.remove('show');
  document.getElementById('reviewWrap').classList.remove('show');
  document.getElementById('quizArea').style.display='block';
  document.getElementById('navArea').style.display='flex';
  document.getElementById('progFill').style.width='0%';
  renderQ(0);
}

function renderQ(idx){
  const q=filtered[idx];
  const done=answers[idx]!==null;
  let optsHTML=q.opts.map((o,i)=>{
    let cls='';
    if(done){cls=i===q.ans?'correct':i===answers[idx]?'wrong':'';}
    const k=String.fromCharCode(65+i);
    return `<li><button class="opt-btn ${cls}" onclick="pick(${idx},${i})" ${done?'disabled':''}><span class="opt-key">${k}</span><span>${o}</span></button></li>`;
  }).join('');
  document.getElementById('quizArea').innerHTML=`
    <div class="q-card">
      <span class="ch-badge">${q.ch==='exam'?'📋 考卷題':('Chapter '+q.ch)}</span>
      ${q.num.includes('*')?'<span class="img-note">⚠ 原題含圖片</span>':''}
      <div class="q-num">第 ${idx+1} 題（共 ${filtered.length} 題）· ${q.num}</div>
      ${q.cardNote?`<div style="background:var(--morandi-wrong-bg,#f4eaea);border:1px solid #d4a8a8;border-radius:8px;padding:6px 10px;font-size:.8rem;color:#7a3a3a;margin-bottom:.8rem;line-height:1.5;">${q.cardNote}</div>`:''}
      <div class="q-text">${q.q}</div>
      <ul class="opts">${optsHTML}</ul>
      <div class="expl-box ${done?'show':''}"><strong>詳解：</strong>${q.expl}</div>
    </div>`;
  document.getElementById('counterPill').textContent=`${idx+1} / ${filtered.length}`;
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').textContent=idx===filtered.length-1?'查看結果 →':'下一題 →';
  updateStats();
}

function pick(qIdx,optIdx){
  if(answers[qIdx]!==null)return;
  answers[qIdx]=optIdx;
  renderQ(qIdx);
}

function changeQ(dir){
  const nxt=current+dir;
  if(nxt<0)return;
  if(nxt>=filtered.length){showResults();return;}
  current=nxt;
  renderQ(current);
}

function updateStats(){
  const ans=answers.filter(a=>a!==null).length;
  const cor=answers.filter((a,i)=>a===filtered[i].ans).length;
  document.getElementById('answeredCount').textContent=ans;
  document.getElementById('correctCount').textContent=cor;
  const pct=(ans/filtered.length)*100;
  document.getElementById('progFill').style.width=pct+'%';
}

function showResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('navArea').style.display='none';
  const panel=document.getElementById('resultsPanel');
  panel.classList.add('show');
  const cor=answers.filter((a,i)=>a===filtered[i].ans).length;
  const tot=filtered.length;
  const pct=Math.round(cor/tot*100);
  document.getElementById('scoreNum').textContent=`${cor}/${tot}`;
  let title,msg;
  if(pct===100){title='完美！';msg='全部答對，表現出色！';}
  else if(pct>=80){title='非常好！';msg=`答對 ${pct}%，掌握扎實。`;}
  else if(pct>=60){title='還不錯！';msg=`答對 ${pct}%，建議複習詳解。`;}
  else{title='繼續加油！';msg=`答對 ${pct}%，請多複習這些概念。`;}
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultMsg').textContent=msg;
  renderSkipped();
}

function showReview(){
  const wrap=document.getElementById('reviewWrap');
  if(wrap.classList.contains('show')){wrap.classList.remove('show');return;}
  let html='';
  filtered.forEach((q,i)=>{
    const ua=answers[i];
    const c=ua===q.ans;
    html+=`<div class="rv-item">
      <div class="tag-sm">Ch.${q.ch} · ${q.num}</div>
      ${q.cardNote?`<div style="background:#f4eaea;border:1px solid #d4a8a8;border-radius:6px;padding:5px 8px;font-size:.77rem;color:#7a3a3a;margin-bottom:.4rem;">${q.cardNote}</div>`:''}
      <div class="rv-status ${c?'c':'w'}"><span class="rv-dot ${c?'c':'w'}"></span>${c?'✓ 答對':'✗ 答錯'}</div>
      <div class="rv-q">${q.q}</div>
      <div class="rv-ans">你的答案：<span>${ua!==null?q.opts[ua]:'未作答'}</span>${!c?` &nbsp;·&nbsp; 正確答案：<span>${q.opts[q.ans]}</span>`:''}</div>
      <div class="rv-expl">${q.expl}</div>
    </div>`;
  });
  wrap.innerHTML=html;
  wrap.classList.add('show');
}

function restartQuiz(){
  answers=new Array(filtered.length).fill(null);
  current=0;
  document.getElementById('resultsPanel').classList.remove('show');
  document.getElementById('reviewWrap').classList.remove('show');
  document.getElementById('quizArea').style.display='block';
  document.getElementById('navArea').style.display='flex';
  document.getElementById('progFill').style.width='0%';
  updateStats();
  renderQ(0);
}

function renderSkipped(){
  document.getElementById('skippedSec').style.display='block';
  document.getElementById('skCount').textContent=SKIPPED.length;
  let html='';
  SKIPPED.forEach(s=>{
    html+=`<div class="sk-item">
      <div style="display:flex;gap:.4rem;margin-bottom:.4rem;flex-wrap:wrap;">
        <span class="tag-sm">Ch.${s.ch}</span>
        <span class="tag-sm">${s.num}</span>
      </div>
      <div class="sk-q">${s.q}</div>
      <div class="sk-ans">正確答案：<strong>${s.ans}</strong></div>
      <div class="sk-note">${s.note}</div>
    </div>`;
  });
  document.getElementById('skippedList').innerHTML=html;
}

filtered=getFiltered();
answers=new Array(filtered.length).fill(null);
document.getElementById('totalCount').textContent=filtered.length;
renderQ(0);
</script>
</body>
</html>
