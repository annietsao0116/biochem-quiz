<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biochemical Signaling · Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #e8ecf0;

    --card:      #f5f7f9;
    --border:    #c8d2dc;
    --accent:    #7a96aa;
    --accent2:   #5e7d8f;
    --text:      #3a4a55;
    --muted:     #7a8e98;
    --correct:   #7aaa8a;
    --wrong:     #c08080;
    --correct-bg:#e8f3ec;
    --wrong-bg:  #f5e8e8;
    --shadow:    rgba(90,120,140,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif TC', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── Header ─── */
  header {
    background: linear-gradient(135deg, #4d6e80 0%, #6b8fa3 60%, #8baab8 100%);

    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  header h1 {
    font-family: 'Lora', serif;
    font-size: 2rem;
    color: #fff;
    font-weight: 600;
    letter-spacing: .04em;
    position: relative;
  }
  header p {
    color: rgba(255,255,255,.75);
    margin-top: .5rem;
    font-size: .9rem;
    font-weight: 300;
    position: relative;
  }

  /* ─── Controls ─── */
  .controls {
    max-width: 860px;
    margin: 1.5rem auto;
    padding: 0 1.2rem;
    display: flex;
    gap: .8rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls label {
    font-size: .82rem;
    color: var(--muted);
    letter-spacing: .03em;
  }
  select, button {
    font-family: 'Noto Serif TC', serif;
    font-size: .88rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: .45rem .9rem;
    cursor: pointer;
    transition: all .2s;
  }
  select:hover, select:focus { border-color: var(--accent); outline: none; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
    padding: .5rem 1.4rem;
  }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn-ghost {
    background: transparent;
    color: var(--accent2);
    border-color: var(--accent);
  }
  .btn-ghost:hover { background: var(--accent); color: #fff; }

  /* ─── Stats bar ─── */
  .stats {
    max-width: 860px;
    margin: 0 auto .5rem;
    padding: 0 1.2rem;
    display: flex;
    gap: 1rem;
    font-size: .82rem;
    color: var(--muted);
  }
  .stats span b { color: var(--text); }

  /* ─── Question list ─── */
  #quiz-container {
    max-width: 860px;
    margin: 0 auto 3rem;
    padding: 0 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  /* ─── Card ─── */
  .q-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.6rem;
    box-shadow: 0 2px 12px var(--shadow);
    transition: box-shadow .2s;
    position: relative;
  }
  .q-card:hover { box-shadow: 0 4px 20px var(--shadow); }

  .q-meta {
    display: flex;
    gap: .6rem;
    margin-bottom: .7rem;
    align-items: center;
  }
  .q-num {
    background: var(--accent);
    color: #fff;
    font-size: .72rem;
    font-weight: 600;
    border-radius: 6px;
    padding: .18rem .5rem;
    letter-spacing: .04em;
  }
  .q-chapter {
    font-size: .72rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: .15rem .5rem;
    letter-spacing: .03em;
  }

  .q-text {
    font-size: .98rem;
    line-height: 1.75;
    margin-bottom: 1rem;
    font-weight: 400;
  }

  /* ─── Options ─── */
  .options { display: flex; flex-direction: column; gap: .55rem; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: .7rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: .7rem 1rem;
    cursor: pointer;
    transition: all .18s;
    font-size: .9rem;
    line-height: 1.5;
    text-align: left;
  }
  .opt:hover:not(.disabled) {
    border-color: var(--accent);
    background: #e4edf3;
  }
  .opt-letter {
    flex-shrink: 0;
    width: 1.5rem; height: 1.5rem;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-size: .75rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: all .18s;
  }
  .opt:hover:not(.disabled) .opt-letter { background: var(--accent); color: #fff; }
  .opt.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .opt.correct .opt-letter { background: var(--correct); color: #fff; }
  .opt.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .opt.wrong .opt-letter { background: var(--wrong); color: #fff; }
  .opt.disabled { cursor: default; }
  .opt.highlight-correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .opt.highlight-correct .opt-letter { background: var(--correct); color: #fff; }

  /* ─── Explanation ─── */
  .explanation {
    display: none;
    margin-top: 1rem;
    padding: 1rem 1.1rem;
    background: linear-gradient(135deg, #dce8f0, #e6eff5);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    font-size: .88rem;
    line-height: 1.8;
    color: var(--text);
    animation: fadeIn .3s ease;
  }
  .explanation.show { display: block; }
  .explanation .exp-title {
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: .4rem;
    font-size: .85rem;
    letter-spacing: .04em;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── Result badge ─── */
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    font-size: .78rem;
    font-weight: 600;
    padding: .2rem .6rem;
    border-radius: 20px;
    margin-left: auto;
  }
  .badge-correct { background: var(--correct-bg); color: #4e8060; }
  .badge-wrong   { background: var(--wrong-bg);   color: #9a5555; }

  /* ─── Empty state ─── */
  #empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
    font-size: 1rem;
  }

  /* ─── Score summary ─── */
  #score-bar {
    max-width: 860px;
    margin: 0 auto 1.2rem;
    padding: 0 1.2rem;
  }
  .score-card {
    background: linear-gradient(135deg, #5b7f95, #7aa0b5);
    border-radius: 12px;
    padding: 1.1rem 1.6rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    color: #fff;
  }
  .score-card .sc-num {
    font-family: 'Lora', serif;
    font-size: 2.2rem;
    font-weight: 600;
    line-height: 1;
  }
  .score-card .sc-label { font-size: .82rem; opacity: .85; }
  .score-card .sc-bar-wrap {
    flex: 1;
    min-width: 120px;
    background: rgba(255,255,255,.25);
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  .score-card .sc-bar {
    height: 100%;
    background: #fff;
    border-radius: 99px;
    transition: width .6s ease;
  }
</style>
</head>

document.getElementById('chapter-filter').addEventListener('change', renderQuiz);
renderQuiz();

function renderQuiz() {
  const filter = document.getElementById('chapter-filter').value;
  displayedQuestions = filter === 'all'
    ? [...ALL_QUESTIONS]
    : ALL_QUESTIONS.filter(q => q.chapter === filter);

  answered = 0; correct = 0;
  updateStats();

  const container = document.getElementById('quiz-container');
  const empty = document.getElementById('empty');
  const scorebar = document.getElementById('score-bar');

  if (displayedQuestions.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    scorebar.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  scorebar.style.display = 'block';

  container.innerHTML = displayedQuestions.map((q, i) => buildCard(q, i)).join('');
}

function buildCard(q, i) {
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const optsHTML = q.opts.map((o, j) => `
    <button class="opt" onclick="answer(${i}, ${j})" id="opt-${i}-${j}" aria-label="選項 ${letters[j]}">
      <span class="opt-letter">${letters[j]}</span>
      <span>${o}</span>
    </button>`).join('');

  return `
  <div class="q-card" id="card-${i}">
    <div class="q-meta">
      <span class="q-num">Q${i+1}</span>
      <span class="q-chapter">${q.label}</span>
      <span id="badge-${i}" style="margin-left:auto"></span>
    </div>
    <div class="q-text">${q.q.replace(/\n/g, '<br>')}</div>
    <div class="options" id="opts-${i}">${optsHTML}</div>
    <div class="explanation" id="exp-${i}">
      <div class="exp-title">📖 中文詳解</div>
      ${q.exp}
    </div>
  </div>`;
}

function answer(qIdx, optIdx) {
  const q = displayedQuestions[qIdx];
  const optsContainer = document.getElementById(`opts-${qIdx}`);

  // Already answered?
  if (optsContainer.querySelector('.correct, .wrong')) return;

  answered++;
  const isCorrect = optIdx === q.ans;
  if (isCorrect) correct++;

  // Style buttons
  Array.from(optsContainer.children).forEach((btn, j) => {
    btn.classList.add('disabled');
    btn.onclick = null;
    if (j === q.ans) btn.classList.add(optIdx === j ? 'correct' : 'highlight-correct');
    else if (j === optIdx && !isCorrect) btn.classList.add('wrong');
  });

  // Badge
  const badge = document.getElementById(`badge-${qIdx}`);
  badge.innerHTML = isCorrect
    ? '<span class="result-badge badge-correct">✓ Correct</span>'
    : '<span class="result-badge badge-wrong">✗ Incorrect</span>';

  // Explanation
  document.getElementById(`exp-${qIdx}`).classList.add('show');

  updateStats();
}

function updateStats() {
  document.getElementById('showing-count').textContent = displayedQuestions.length;
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('sc-num').textContent = `${correct}/${answered}`;
  const pct = answered > 0 ? Math.round(correct/answered*100) : 0;
  document.getElementById('sc-bar').style.width = pct + '%';
}



function resetAll() {
  answered = 0; correct = 0;
  renderQuiz();
}
</script>
</body>
</html>
